<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Via ROMA</title>
<meta name="description" content="Involveds månedlige ROMA-samtale på 3 minutter per prosjekt: sju signaler, tre tall, tre linjer med viktigste punkter, og eksport til leder og Excel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg: #EDF0EC; --surface: #FFFFFF; --surface-2: #F5F7F4; --line: #D4DAD5; --line-strong: #B9C2BB;
    --ink: #172026; --muted: #5B6B70;
    --accent: #257A6B; --accent-ink: #FFFFFF; --accent-soft: #DCEFEA;
    --gold: #C8912A; --gold-soft: #F7EBD2; --gold-ink: #6E4B08;
    --ok: #2E8B57; --ok-soft: #DDF1E4; --ok-ink: #1E6B3F;
    --risk: #C9931E; --risk-soft: #FBF0D2; --risk-ink: #7A5600;
    --tiltak: #C94B3D; --tiltak-soft: #F9E0DC; --tiltak-ink: #9A2F24;
    --skip: #8A9599; --skip-soft: #E8ECEA;
    --shadow: 0 10px 30px -18px rgba(23, 32, 38, .35); --radius: 14px;
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1719; --surface: #16232A; --surface-2: #1D2C33; --line: #2C3D44; --line-strong: #3F535B;
      --ink: #E6EDEA; --muted: #93A5A6;
      --accent: #4FB3A0; --accent-ink: #0B1A18; --accent-soft: #1B3A37;
      --gold: #E1AF4B; --gold-soft: #3A2F16; --gold-ink: #F1D48C;
      --ok: #5CC189; --ok-soft: #1B3527; --ok-ink: #9FE0BA;
      --risk: #E4B54A; --risk-soft: #3B311A; --risk-ink: #F3D48A;
      --tiltak: #E8735F; --tiltak-soft: #402220; --tiltak-ink: #F5B0A3;
      --skip: #93A5A6; --skip-soft: #24343A;
      --shadow: 0 10px 30px -18px rgba(0, 0, 0, .8);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1719; --surface: #16232A; --surface-2: #1D2C33; --line: #2C3D44; --line-strong: #3F535B;
    --ink: #E6EDEA; --muted: #93A5A6;
    --accent: #4FB3A0; --accent-ink: #0B1A18; --accent-soft: #1B3A37;
    --gold: #E1AF4B; --gold-soft: #3A2F16; --gold-ink: #F1D48C;
    --ok: #5CC189; --ok-soft: #1B3527; --ok-ink: #9FE0BA;
    --risk: #E4B54A; --risk-soft: #3B311A; --risk-ink: #F3D48A;
    --tiltak: #E8735F; --tiltak-soft: #402220; --tiltak-ink: #F5B0A3;
    --skip: #93A5A6; --skip-soft: #24343A;
    --shadow: 0 10px 30px -18px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); }
  h2 { font-size: clamp(1.2rem, 2.4vw, 1.5rem); }
  h3 { font-size: 1.05rem; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
  .small { font-size: .85rem; }
  #app { max-width: 860px; margin: 0 auto; padding-block: 0 90px; padding-inline: clamp(16px, 3vw, 28px); }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 6; background: var(--bg); min-height: 54px; }
  .brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .brand strong { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
  .brand span { font-size: .72rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .tabs { display: flex; gap: 4px; }
  .tab { border: 1px solid transparent; background: transparent; padding: 6px 12px; border-radius: 999px; color: var(--muted); font-weight: 500; }
  .tab[aria-current="page"] { background: var(--surface); border-color: var(--line); color: var(--ink); }
  .hud { display: flex; align-items: center; gap: 10px; min-width: 40px; justify-content: flex-end; }
  .hud .stat { font-family: var(--font-mono); font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .ring { width: 34px; height: 34px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .track { stroke: var(--line); }
  .ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .9s linear; }
  .ring.over .bar { stroke: var(--risk); }
  @media (max-width: 560px) { .brand span { display: none; } .tab { padding: 6px 9px; font-size: .9rem; } }

  main { padding-block: 18px; }
  section[hidden] { display: none !important; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; min-height: 44px; transition: transform .08s ease, background .15s ease; }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
  .btn.small { padding: 5px 10px; min-height: 32px; font-size: .85rem; border-radius: 8px; }
  .btn.danger { color: var(--tiltak-ink); border-color: var(--tiltak); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label, .field legend { font-size: .8rem; font-weight: 600; color: var(--muted); padding: 0; }
  .field input, .field select, .field textarea { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 9px; padding: 9px 11px; width: 100%; }
  .field textarea { min-height: 60px; resize: vertical; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } input, select, textarea { font-size: 16px; } }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; transition: all .25s ease; pointer-events: none; z-index: 20; box-shadow: var(--shadow); max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .note { border-radius: 10px; padding: 10px 14px; font-size: .88rem; border: 1px solid var(--line); background: var(--surface-2); }
  .note.gold { background: var(--gold-soft); border-color: var(--gold); color: var(--ink); }
  .note.red { background: var(--tiltak-soft); border-color: var(--tiltak); }
  .note.privacy { border-style: dashed; }
  .note ul { margin: 6px 0 0; padding-left: 20px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
  .pill.open { background: var(--tiltak-soft); color: var(--tiltak-ink); }
  .pill.closed { background: var(--ok-soft); color: var(--ok-ink); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  details > summary { cursor: pointer; font-weight: 600; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
  .kpi b { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 600; display: block; line-height: 1.1; }
  .kpi small { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .kpi.ok b { color: var(--ok-ink); } .kpi.tiltak b { color: var(--tiltak-ink); }

  .home { display: flex; flex-direction: column; gap: 16px; }
  .home-head { display: flex; flex-direction: column; gap: 6px; max-width: 60ch; }
  .plist { display: flex; flex-direction: column; gap: 10px; }
  .pcard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .pcard input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }
  .pcard .pname { display: flex; flex-direction: column; gap: 2px; min-width: 0; cursor: pointer; }
  .pcard .pname b { font-size: 1.02rem; }
  .pcard .pmeta { display: flex; gap: 10px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
  .pcard .pmeta .due { color: var(--tiltak-ink); font-weight: 600; }
  .pcard .pmeta .streak { color: var(--gold-ink); font-weight: 600; }
  .pcard.off { opacity: .55; }
  .startbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .startbar .btn.primary { font-size: 1.05rem; padding: 12px 26px; }
  .resume { border: 1px dashed var(--gold); background: var(--gold-soft); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .roma-letters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .roma-letters div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); font-size: .8rem; color: var(--muted); }
  .roma-letters b { font-family: var(--font-display); font-size: 1.4rem; color: var(--accent); display: block; line-height: 1; }
  @media (max-width: 520px) { .roma-letters { grid-template-columns: repeat(2, 1fr); } }
  .pform { display: flex; flex-direction: column; gap: 12px; }
  .pulse { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 560px) { .pulse { grid-template-columns: 1fr; } }
  .scale { display: flex; gap: 4px; }
  .scale button { flex: 1; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 6px 0; min-height: 42px; font-family: var(--font-mono); font-weight: 600; }
  .scale button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .anchor { font-size: .78rem; color: var(--muted); min-height: 1.2em; }

  .run { display: flex; flex-direction: column; gap: 14px; }
  .run-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .lastbox { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--surface-2); font-size: .9rem; }
  .lights-mini { display: inline-flex; gap: 3px; vertical-align: middle; }
  .lights-mini i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; background: var(--line-strong); }
  .lights-mini i.OK { background: var(--ok); } .lights-mini i.Risiko { background: var(--risk); } .lights-mini i.Tiltak { background: var(--tiltak); }
  .siglist { display: flex; flex-direction: column; gap: 8px; }
  .sig { border: 1px solid var(--line); border-left-width: 5px; border-left-color: var(--ok); border-radius: 12px; background: var(--surface); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
  .sig.st-Risiko { border-left-color: var(--risk); }
  .sig.st-Tiltak { border-left-color: var(--tiltak); }
  .sig.cursor { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
  .sig-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  @media (max-width: 560px) { .sig-main { grid-template-columns: 1fr; } }
  .sig-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .sig-text .lbl { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .sig-text .lbl .roma { color: var(--accent); font-family: var(--font-display); font-weight: 700; }
  .sig-text .lbl b { font-size: .95rem; }
  .sig-text .lbl .sist { font-size: .74rem; color: var(--muted); }
  .sig-text .lbl .chg { font-size: .72rem; color: var(--gold-ink); font-weight: 600; }
  .sig-text p { font-size: .92rem; }
  .lights { display: flex; gap: 6px; }
  .light { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; min-height: 40px; padding: 4px 12px; display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: .85rem; color: var(--muted); }
  .light i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; background: var(--line-strong); }
  .light.OK i { background: var(--ok); } .light.Risiko i { background: var(--risk); } .light.Tiltak i { background: var(--tiltak); }
  .light[aria-pressed="true"] { color: var(--ink); }
  .light.OK[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); }
  .light.Risiko[aria-pressed="true"] { background: var(--risk-soft); border-color: var(--risk); }
  .light.Tiltak[aria-pressed="true"] { background: var(--tiltak-soft); border-color: var(--tiltak); }
  .light kbd { font-family: var(--font-mono); font-size: .66rem; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; color: var(--muted); }
  @media (hover: none) { .light kbd { display: none; } .lights { width: 100%; } .light { flex: 1; justify-content: center; min-height: 44px; } }
  .fields { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .fld { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--surface-2); }
  .fld input[type="number"] { width: 4.5em; border: 0; background: transparent; padding: 4px; font-family: var(--font-mono); text-align: right; }
  .fld input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--tiltak); }
  .detail { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .detail textarea, .detail input[type="text"] { border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; width: 100%; background: var(--surface-2); }
  .detail textarea { min-height: 48px; resize: vertical; }
  .tiltak-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  @media (max-width: 640px) { .tiltak-grid { grid-template-columns: 1fr; } }
  .frist { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .frist button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 9px; font-size: .78rem; min-height: 32px; }
  .frist button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .frist input[type="date"] { border: 1px solid var(--line-strong); border-radius: 8px; padding: 4px 6px; background: var(--surface-2); }
  .deeper { font-size: .8rem; color: var(--muted); }
  .deeper summary { font-weight: 500; }
  .deeper .qlist { margin-top: 8px; }
  .punkter { display: flex; flex-direction: column; gap: 10px; }
  .prow { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  @media (max-width: 640px) { .prow { grid-template-columns: 1fr; } .prow .mic { justify-self: end; } }
  .prow label { font-size: .82rem; font-weight: 600; color: var(--muted); }
  .prow input { border: 1px solid var(--line-strong); border-radius: 9px; padding: 9px 11px; width: 100%; background: var(--surface); }
  .prow .prev { grid-column: 2; font-size: .8rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  @media (max-width: 640px) { .prow .prev { grid-column: 1; } }
  .mic { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; width: 40px; height: 40px; display: grid; place-items: center; }
  .mic.on { background: var(--tiltak-soft); border-color: var(--tiltak); }
  .run-foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line); padding: 10px clamp(16px, 3vw, 28px); }
  .run-foot .inner { max-width: 860px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .run-foot .hint { font-size: .78rem; color: var(--muted); }
  .run-foot .hint kbd { font-family: var(--font-mono); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; font-size: .7rem; }
  @media (max-width: 640px) { .run-foot .hint { display: none; } .run-foot .inner .btn.primary { flex: 1; } }
  body.kb .run-foot { display: none; }

  .area { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .area-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
  .area-head .roma { color: var(--accent); font-family: var(--font-display); font-size: 1rem; letter-spacing: 0; text-transform: none; margin-right: 6px; }
  .qlist { display: flex; flex-direction: column; gap: 8px; }
  .q { border: 1px solid var(--line); border-left-width: 4px; border-left-color: var(--ok); border-radius: 12px; background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .q.st-Risiko { border-left-color: var(--risk); }
  .q.st-Tiltak { border-left-color: var(--tiltak); }
  .q.cursor { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
  .q .qtext { display: flex; gap: 8px; align-items: baseline; }
  .q .qtext .n { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); min-width: 1.6em; }
  .q .qtext p { font-weight: 500; font-size: .92rem; }
  .q .help { font-size: .78rem; color: var(--muted); padding-left: calc(1.6em + 8px); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: .84rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; }
  .chip:hover { background: var(--surface-2); }
  .chip.OK[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok-ink); }
  .chip.Risiko[aria-pressed="true"] { background: var(--risk-soft); border-color: var(--risk); color: var(--risk-ink); }
  .chip.Tiltak[aria-pressed="true"] { background: var(--tiltak-soft); border-color: var(--tiltak); color: var(--tiltak-ink); }
  .chip.opt { font-weight: 500; }
  .chip.opt[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }

  .done { display: flex; flex-direction: column; gap: 16px; }
  .export .btn-row .btn { flex: 1 1 180px; }
  .teams { font-family: var(--font-mono); font-size: .82rem; white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow: auto; margin: 0; }
  .psum { display: flex; flex-direction: column; gap: 10px; }
  .psum .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: .9rem; color: var(--muted); }
  .stats b { color: var(--ink); font-family: var(--font-mono); }

  .overview { display: flex; flex-direction: column; gap: 16px; }
  .proj { display: grid; grid-template-columns: minmax(0, 1.4fr) 140px 200px; gap: 14px; align-items: center; }
  @media (max-width: 720px) { .proj { grid-template-columns: 1fr; } }
  .spark { width: 100%; height: 48px; }

        ${open.length ? `<div class="prev muted small">Åpne tiltak: ${open.map(t => esc(t.tekst)).join(" · ")}</div>` : ""}
      </div>

        <summary>Full ROMA, 30 spørsmål${deepDue ? " · anbefalt nå (kvartal)" : ` · sist ${fmtDate(lastDeep.date)}`}</summary>

  el.addEventListener("focusin", ev => { if (/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName) && matchMedia("(max-width: 640px)").matches) document.body.classList.add("kb"); });

}

/* ---------- dybderader (full ROMA) ---------- */
function renderRow(s, a, q, i) {
  const ans = s.answers[q.id]; const flagged = ans.status === "Risiko" || ans.status === "Krever tiltak";
  const chips = STATUS.map(st => `<button type="button" class="chip ${SC[st]}" data-status="${esc(st)}" aria-pressed="${ans.status === st}">${st === "Krever tiltak" ? "Tiltak" : st}</button>`).join("");
  const choice = q.choice ? `<div class="chips">${q.choice.map(([lab, st]) => `<button type="button" class="chip opt" data-opt="${esc(lab)}" data-optstatus="${esc(st)}" aria-pressed="${ans.value === lab}">${esc(lab)}</button>`).join("")}</div>` : "";
  const scale = q.scale ? `<div class="chips">${SCALE.map(([v, lab, st]) => `<button type="button" class="chip opt" data-opt="${v}" data-optstatus="${st}" aria-pressed="${String(ans.value) === String(v)}">${v} ${lab}</button>`).join("")}</div>` : "";
  const fields = q.fields ? `<div class="fields">${q.fields.map(f => `<label class="fld"><span>${esc(f.l)}</span><input type="number" inputmode="decimal" step="any" data-fld="${f.k}" value="${esc(ans.fields[f.k] || "")}"><em>${esc(f.u)}</em></label>`).join("")}</div>` : "";
  let detail = "";

  else if (q.commentOnOk) detail = `<div class="detail" style="border-top:0;padding-top:0"><input type="text" data-field="comment" placeholder="${q.scale ? "Grunnlag, én setning" : "Eksempel, én setning"}" value="${esc(ans.comment)}" aria-label="Kommentar"></div>`;
  return `<div class="q st-${SC[ans.status]}" data-q="${q.id}" tabindex="-1"><div class="qtext"><span class="n">${i + 1}</span><p>${esc(q.t)}</p></div><div class="help">${esc(q.help)}</div>${choice}${scale}${fields}<div class="chips">${chips}</div>${detail}</div>`;
}
function setDeep(s, q, status) {
  const ans = s.answers[q.id]; ans.status = status; ans.carried = false;
  if (status !== "OK") { if (!ans.frist) ans.frist = addDays(s.date, 14); if (!ans.ansvarlig) ans.ansvarlig = store.me.konsulent; if (status === "Krever tiltak" && !ans.tiltak && q.tiltak) ans.tiltak = q.tiltak; }
  else { ans.tiltak = ""; ans.frist = ""; ans.ansvarlig = ""; if (!q.commentOnOk) ans.comment = ""; }
  saveDraft();
  $$(`.q[data-q="${q.id}"]`).forEach(old => { const a = Q_AREA[q.id]; const hadCursor = old.classList.contains("cursor"); const tmp = document.createElement("div"); tmp.innerHTML = renderRow(s, a, q, a.qs.indexOf(q)); const fresh = tmp.firstElementChild; old.replaceWith(fresh); if (hadCursor) { fresh.classList.add("cursor"); cursorRow = fresh; } });
  bindRow(s, Q_AREA[q.id], q);
}
function bindRow(s, a, q) {
  $$(`.q[data-q="${q.id}"]`).forEach(row => {
    const ans = s.answers[q.id];
    row.addEventListener("click", () => setCursor(row));
    $$("[data-status]", row).forEach(b => b.addEventListener("click", () => setDeep(s, q, b.dataset.status)));
    $$("[data-opt]", row).forEach(b => b.addEventListener("click", () => { ans.value = b.dataset.opt; setDeep(s, q, b.dataset.optstatus); }));
    $$("[data-field]", row).forEach(inp => inp.addEventListener("input", () => { ans[inp.dataset.field] = inp.value; }));
    $$("[data-fld]", row).forEach(inp => inp.addEventListener("change", () => { ans.fields[inp.dataset.fld] = inp.value; saveDraft(); const sug = q.auto ? q.auto(ans.fields) : null; if (sug && RANK[sug] > RANK[ans.status]) setDeep(s, q, sug); }));
  });
}
let cursorRow = null;
function setCursor(row) { if (cursorRow && cursorRow !== row) cursorRow.classList.remove("cursor"); cursorRow = row; row.classList.add("cursor"); }
function moveCursor(dir) {
  const rows = $$("#screen-run .sig, #screen-run .q").filter(r => r.offsetParent !== null); if (!rows.length) return;
  let i = cursorRow ? rows.indexOf(cursorRow) : -1; i = Math.min(rows.length - 1, Math.max(0, i + dir));
  setCursor(rows[i]); rows[i].scrollIntoView({ block: "center" });
}
document.addEventListener("keydown", ev => {
  if (!okt || $("#screen-run").hidden || ev.repeat || ev.altKey) return;
  const mod = ev.ctrlKey || ev.metaKey; const tag = ev.target.tagName;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) { if (ev.key === "Escape") ev.target.blur(); if (ev.key === "Enter" && mod) { ev.preventDefault(); nextProject(); } return; }
  if (mod) return; if (tag === "BUTTON" && ev.key === "Enter") return;
  const s = cur();
  if (ev.key === "ArrowDown" || ev.key === "j") { ev.preventDefault(); moveCursor(1); }
  else if (ev.key === "ArrowUp" || ev.key === "k") { ev.preventDefault(); moveCursor(-1); }
  else if (["1", "2", "3"].includes(ev.key)) { if (!cursorRow) moveCursor(1); ev.preventDefault(); const st = STATUS[Number(ev.key) - 1]; if (cursorRow.dataset.sig) setSig(s, SIG_BY[cursorRow.dataset.sig], st, true); else if (cursorRow.dataset.q) setDeep(s, Q_BY[cursorRow.dataset.q], st); }
  else if (ev.key === "Enter") { ev.preventDefault(); nextProject(); }
});
function nextProject() {
  const s = cur(); s.elapsed = elapsedSec(s); s.elapsedBase = s.elapsed; s.startedAt = Date.now(); cursorRow = null;
  if (okt.idx < okt.queue.length - 1) { okt.idx++; const n = cur(); n.startedAt = Date.now(); n.elapsedBase = n.elapsed || 0; saveDraft(); toast(`${s.project.prosjekt} ferdig på ${fmtMin(s.elapsed)}`); renderRun(); }
  else finishOkt();
}

/* =====================================================================
   ANALYSE
   ===================================================================== */
function flaggedSignals(s) { return SIGNALS.filter(S => s.sig[S.id] && s.sig[S.id].status !== "OK"); }
function deepRows(s) { if (!s.deep) return []; return ALL_Q.map(({ area, q }) => ({ area, q, ans: s.answers[q.id], status: s.answers[q.id].status })); }
function fieldText(q, ans) {
  const parts = [];
  if (ans.value) parts.push(q.scale ? `${ans.value}/5 ${(SCALE.find(x => String(x[0]) === String(ans.value)) || [])[1] || ""}`.trim() : ans.value);
  (q.fields || []).forEach(f => { const v = (ans.fields || {})[f.k]; if (v) parts.push(`${f.l}: ${v}${f.u ? " " + f.u : ""}`); });
  return parts.join(" · ");
}
function sigFieldText(S, s) { const f = s.fields || {}; const parts = []; sigFields(S, s).forEach(x => { if (f[x.k]) parts.push(`${x.l} ${f[x.k]} ${x.u}`); }); if (S.toggle && f[S.toggle.k]) parts.push(S.toggle.l); if (S.id === "S7" && s.project.sluttdato) parts.push(`løper ut ${fmtDate(s.project.sluttdato)}`); return parts.join(" · "); }
function collectTiltak(s) {
  const out = [];
  SIGNALS.forEach(S => { const a = s.sig[S.id]; if (a.status === "OK" || S.sensitive) return; if (a.tiltak.trim() || a.status === "Krever tiltak") out.push({ area: S.name, tekst: a.tiltak.trim() || `Følg opp: ${S.name.toLowerCase()}`, ansvarlig: a.ansvarlig || store.me.konsulent, frist: a.frist, kommentar: a.comment }); });
  const tr = (s.punkter.trenger || "").trim();
  if (tr && !/^(ingenting|ingen|nei|-)\.?$/i.test(tr)) out.push({ area: "Trenger fra Involved", tekst: tr, ansvarlig: store.me.teamleder || "Leder", frist: addDays(s.date, 14), kommentar: "" });
  deepRows(s).forEach(r => { if (r.status === "OK" || r.q.sensitive) return; if ((r.ans.tiltak || "").trim() || r.status === "Krever tiltak") out.push({ area: r.area.name, tekst: (r.ans.tiltak || "").trim() || `Følg opp: ${r.q.t}`, ansvarlig: r.ans.ansvarlig || store.me.konsulent, frist: r.ans.frist, kommentar: r.ans.comment }); });
  return out;
}
function redFlags(s) {
  const f = []; const F = s.fields || {}; const G = s.sig; const p = s.project; const hasNums = sigFields(SIG_BY.S3, s).length > 0;
  if (num(F.timer_uke) > 45) f.push(`Over 45 timer per uke (${F.timer_uke} t)`);
  if (hasNums && F.ramme && F.fremdrift && num(F.ramme) > 80 && num(F.fremdrift) < 60) f.push(`${p.kontraktstype === "Fastpris" ? "Kalkyle" : "Ramme"} ${F.ramme} % brukt med fremdrift ${F.fremdrift} %`);
  if (F.utestaende) f.push("Utestående fakturaer over 30 dager");
  if (G.S4.status === "Krever tiltak") f.push("Arbeid utenfor omfang eller rolle uten skriftlig bestilling, sjekk forsikringsdekning");
  if (p.kontrakt && p.kontrakt !== "Ja") f.push("Kontrakt ikke signert og lagret på SharePoint");
  if (G.S5.status === "Krever tiltak") f.push("Kunden er misfornøyd: ring kunden, klage meldes i avvikssystemet");
  if (G.S6.status === "Krever tiltak") f.push("Uønsket atferd eller konflikt hos kunde: varslingsrutinen, leder tar kontakt innen én uke");
  if (G.S7.status === "Krever tiltak" || (p.sluttdato && p.sluttdato < addDays(s.date, 90) && G.S7.status !== "OK")) f.push(`Oppdraget løper ut ${fmtDate(p.sluttdato) || "snart"} uten avklart neste fase`);
  if (s.deep) { const A = s.answers; if (num((A.o3.fields || {}).endringstimer) > 20) f.push("Over 20 timer arbeid uten bestilling"); if (A.s4.value === "Klage" || A.k2.status === "Krever tiltak") f.push("Klage eller reklamasjon: meld i avvikssystemet"); if (A.p4.status === "Krever tiltak") f.push("Uønsket atferd hos kunde: varslingsrutinen"); }
  return Array.from(new Set(f));
}
function pulseWarnings(s) {
  const w = []; const pv = s.pulse || {}; if (!pv.belastning) return w;
  const prev = s.prevId ? store.sessions.find(x => x.id === s.prevId) : null; const pp = prev && prev.pulse && prev.pulse.belastning ? prev.pulse : null;
  if (pv.belastning >= 4) w.push(`Belastning ${pv.belastning}/5: leder avtaler samtale innen én uke${pp && pp.belastning >= 4 ? ". To måneder på rad: skriftlig tiltak" : ""}`);
  if (pv.trivsel <= 2) w.push(`Trivsel ${pv.trivsel}/5: samtale innen én uke${pp && pp.trivsel <= 2 ? ". To måneder på rad: ledergruppen informeres" : ""}`);
  if (pp) { if (pv.belastning - pp.belastning >= 2) w.push(`Belastning ${pp.belastning} → ${pv.belastning}: spør hvorfor`); if (pp.trivsel - pv.trivsel >= 2) w.push(`Trivsel ${pp.trivsel} → ${pv.trivsel}: spør hvorfor`); }
  return w;
}
function ampel(s) { if (redFlags(s).length || pulseWarnings(s).length || flaggedSignals(s).some(S => s.sig[S.id].status === "Krever tiltak")) return "Rødt"; return flaggedSignals(s).length ? "Gult" : "Grønt"; }
function teamsText(s) {
  const prev = s.prevId ? store.sessions.find(x => x.id === s.prevId) : null;
  const changed = SIGNALS.filter(S => prev && prev.sig && prev.sig[S.id] && prev.sig[S.id].status !== s.sig[S.id].status);
  const lines = [];
  lines.push(`ROMA ${fmtMonth(s.date)} · ${s.project.prosjekt}${s.project.kunde ? ` (${s.project.kunde})` : ""} · ${s.project.konsulent}`);
  lines.push(`Signaler: ${SIGNALS.map(S => LIGHT_EMOJI[s.sig[S.id].status]).join("")}${changed.length ? `  (${changed.length} endret: ${changed.map(S => `${S.name} ${LIGHT_EMOJI[prev.sig[S.id].status]}→${LIGHT_EMOJI[s.sig[S.id].status]}`).join(", ")})` : prev ? "  (uendret)" : ""}`);
  redFlags(s).forEach(x => lines.push(`! ${x}`));
  flaggedSignals(s).forEach(S => { const a = s.sig[S.id]; lines.push(`${LIGHT_EMOJI[a.status]} ${S.name}${sigFieldText(S, s) ? ` (${sigFieldText(S, s)})` : ""}${a.comment && !S.sensitive ? `: ${a.comment}` : S.sensitive ? ": tas muntlig" : ""}`); });

  collectTiltak(s).forEach(t => lines.push(`→ Tiltak: ${t.tekst} (${t.ansvarlig}, ${fmtDate(t.frist) || "frist?"})`));

  lines.push(`Neste ROMA: ${fmtDate(addMonths(s.date, 1))}${streakFor(s.projectId, s.date) >= 2 ? ` · streak ×${streakFor(s.projectId, s.date)}` : ""}`);

}
function leaderText(sessions) {

  const head = `Puls ${fmtMonth(sessions[0].date)} · ${store.me.konsulent}: belastning ${pv.belastning || "–"} · trivsel ${pv.trivsel || "–"}${pw.length ? "\n" + pw.map(x => `! ${x}`).join("\n") : ""}`;
  return [head, ...sessions.map(teamsText)].join("\n\n");

function finishOkt() {
  stopTimer();
  const finished = [];
  okt.queue.forEach(pid => {
    const s = okt.sessions[pid];
    if (!s.finishedAt) { s.elapsed = s.elapsed || elapsedSec(s); s.finishedAt = new Date().toISOString(); }
    s.pulse = Object.assign({}, okt.pulse);
    store.sessions.push(s);
    if (!store.best[pid] || s.elapsed < store.best[pid]) store.best[pid] = s.elapsed;
    collectTiltak(s).forEach(t => {
      const dup = store.tiltak.find(x => x.projectId === pid && x.status === "Åpen" && x.tekst === t.tekst);
      if (dup) { dup.kommentar = t.kommentar || dup.kommentar; dup.frist = t.frist || dup.frist; return; }
      store.tiltak.push({ id: uid(), sessionId: s.id, projectId: pid, dato: s.date, prosjekt: s.project.prosjekt, tekst: t.tekst, ansvarlig: t.ansvarlig, frist: t.frist, status: "Åpen", kommentar: t.kommentar, area: t.area });
    });
    finished.push(s);
  });
  okt = null; store.okt = null; saveStore();
  renderDone(finished);
  if (window.confetti && !matchMedia("(prefers-reduced-motion: reduce)").matches) confetti({ particleCount: 90, spread: 70, origin: { y: .6 }, colors: ["#257A6B", "#C8912A", "#2E8B57", "#FFFFFF"] });
}

/* =====================================================================

   ===================================================================== */
function renderDone(sessions) {

  const el = $("#screen-done"); const multi = sessions.length > 1;

  const nFlag = sessions.reduce((n, s) => n + flaggedSignals(s).length, 0);
  const allFlags = sessions.flatMap(s => redFlags(s).map(x => ({ p: s.project.prosjekt, x })));
  const pw = pulseWarnings(sessions[0]);
  const allTiltak = sessions.flatMap(s => collectTiltak(s).map(t => Object.assign({ p: s.project.prosjekt }, t)));
  const records = sessions.filter(s => store.best[s.projectId] === s.elapsed && sessionsFor(s.projectId).length > 1);
  el.innerHTML = `
    <div class="done">
      <div>
        <span class="eyebrow">Levert · ${fmtDate(sessions[0].date)}</span>
        <h1>${nFlag === 0 && !allFlags.length ? `Alt grønt på ${fmtMin(total)}.` : `Ferdig på ${fmtMin(total)}. ${nFlag} signal${nFlag === 1 ? "" : "er"} å følge opp.`}</h1>
        <div class="stats">${sessions.map(s => `<span>${esc(s.project.prosjekt)} <b>${fmtMin(s.elapsed)}</b>${streakFor(s.projectId, s.date) >= 2 ? ` · streak ×${streakFor(s.projectId, s.date)}` : ""}${records.includes(s) ? " · ny rekord" : ""}</span>`).join("")}</div>
      </div>

      if (data.me && typeof data.me === "object" && !store.me.konsulent) { store.me.konsulent = String(data.me.konsulent || ""); store.me.teamleder = String(data.me.teamleder || ""); }
      if (data.best && typeof data.best === "object") Object.entries(data.best).forEach(([k, v]) => { if (Number(v) > 0 && (!store.best[k] || Number(v) < store.best[k])) store.best[k] = Number(v); });

    r.readAsText(f);
  });
  $$("[data-tiltak]", el).forEach(cb => cb.addEventListener("change", () => { const t = store.tiltak.find(x => x.id === cb.dataset.tiltak); if (!t) return; t.status = cb.checked ? "Lukket" : "Åpen"; saveStore(); renderOverview(); }));
  $$("[data-open]", el).forEach(b => b.addEventListener("click", () => { const s = store.sessions.find(x => x.id === b.dataset.open); if (s) renderDone([s]); }));
}
