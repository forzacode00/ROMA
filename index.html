<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Via ROMA</title>
<meta name="description" content="Involveds månedlige ROMA-samtale på 10 minutter per prosjekt: alt er grønt til du flagger noe, forrige måned ligger klar, og resultatet går rett til Excel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg: #EDF0EC; --surface: #FFFFFF; --surface-2: #F5F7F4; --line: #D4DAD5; --line-strong: #B9C2BB;
    --ink: #172026; --muted: #5B6B70;
    --accent: #257A6B; --accent-ink: #FFFFFF; --accent-soft: #DCEFEA;
    --gold: #C8912A; --gold-soft: #F7EBD2; --gold-ink: #6E4B08;
    --ok: #2E8B57; --ok-soft: #DDF1E4; --ok-ink: #1E6B3F;
    --risk: #C9931E; --risk-soft: #FBF0D2; --risk-ink: #7A5600;
    --tiltak: #C94B3D; --tiltak-soft: #F9E0DC; --tiltak-ink: #9A2F24;
    --skip: #8A9599; --skip-soft: #E8ECEA;
    --shadow: 0 10px 30px -18px rgba(23, 32, 38, .35); --radius: 14px;
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1719; --surface: #16232A; --surface-2: #1D2C33; --line: #2C3D44; --line-strong: #3F535B;
      --ink: #E6EDEA; --muted: #93A5A6;
      --accent: #4FB3A0; --accent-ink: #0B1A18; --accent-soft: #1B3A37;
      --gold: #E1AF4B; --gold-soft: #3A2F16; --gold-ink: #F1D48C;
      --ok: #5CC189; --ok-soft: #1B3527; --ok-ink: #9FE0BA;
      --risk: #E4B54A; --risk-soft: #3B311A; --risk-ink: #F3D48A;
      --tiltak: #E8735F; --tiltak-soft: #402220; --tiltak-ink: #F5B0A3;
      --skip: #93A5A6; --skip-soft: #24343A;
      --shadow: 0 10px 30px -18px rgba(0, 0, 0, .8);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1719; --surface: #16232A; --surface-2: #1D2C33; --line: #2C3D44; --line-strong: #3F535B;
    --ink: #E6EDEA; --muted: #93A5A6;
    --accent: #4FB3A0; --accent-ink: #0B1A18; --accent-soft: #1B3A37;
    --gold: #E1AF4B; --gold-soft: #3A2F16; --gold-ink: #F1D48C;
    --ok: #5CC189; --ok-soft: #1B3527; --ok-ink: #9FE0BA;
    --risk: #E4B54A; --risk-soft: #3B311A; --risk-ink: #F3D48A;
    --tiltak: #E8735F; --tiltak-soft: #402220; --tiltak-ink: #F5B0A3;
    --skip: #93A5A6; --skip-soft: #24343A;
    --shadow: 0 10px 30px -18px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); }
  h2 { font-size: clamp(1.25rem, 2.4vw, 1.6rem); }
  h3 { font-size: 1.05rem; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
  .small { font-size: .85rem; }
  #app { max-width: 980px; margin: 0 auto; padding-block: 0 80px; padding-inline: clamp(16px, 3vw, 28px); }

  /* ---------- top bar ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 6; background: var(--bg); min-height: 56px; }
  .brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .brand strong { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
  .brand span { font-size: .72rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .tabs { display: flex; gap: 4px; }
  .tab { border: 1px solid transparent; background: transparent; padding: 6px 12px; border-radius: 999px; color: var(--muted); font-weight: 500; }
  .tab[aria-current="page"] { background: var(--surface); border-color: var(--line); color: var(--ink); }
  .hud { display: flex; align-items: center; gap: 12px; }
  .hud .stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
  .hud .stat b { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hud .stat b.over { color: var(--tiltak); }
  .hud .stat small { font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .ring { width: 38px; height: 38px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .track { stroke: var(--line); }
  .ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .ring.warn .bar { stroke: var(--risk); }
  .ring.over .bar { stroke: var(--tiltak); }
  @media (max-width: 560px) { .brand span { display: none; } .hud .stat small { display: none; } .tab { padding: 6px 9px; font-size: .9rem; } }

  main { padding-block: 20px; }
  section[hidden] { display: none !important; }

  /* ---------- generic ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; min-height: 44px; transition: transform .08s ease, background .15s ease; }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
  .btn.small { padding: 5px 10px; min-height: 32px; font-size: .85rem; border-radius: 8px; }
  .btn.danger { color: var(--tiltak-ink); border-color: var(--tiltak); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label, .field legend { font-size: .8rem; font-weight: 600; color: var(--muted); padding: 0; }
  .field input, .field select, .field textarea { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 9px; padding: 9px 11px; width: 100%; }
  .field textarea { min-height: 60px; resize: vertical; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } input, select, textarea { font-size: 16px; } }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; transition: all .25s ease; pointer-events: none; z-index: 20; box-shadow: var(--shadow); max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .note { border-radius: 10px; padding: 10px 14px; font-size: .88rem; border: 1px solid var(--line); background: var(--surface-2); }
  .note.gold { background: var(--gold-soft); border-color: var(--gold); color: var(--ink); }
  .note.red { background: var(--tiltak-soft); border-color: var(--tiltak); }
  .note.privacy { border-style: dashed; }
  .note ul { margin: 6px 0 0; padding-left: 20px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
  .pill.OK { background: var(--ok-soft); color: var(--ok-ink); }
  .pill.Risiko { background: var(--risk-soft); color: var(--risk-ink); }
  .pill.Tiltak { background: var(--tiltak-soft); color: var(--tiltak-ink); }
  .pill.Skip { background: var(--skip-soft); color: var(--muted); }
  .pill.open { background: var(--tiltak-soft); color: var(--tiltak-ink); }
  .pill.closed { background: var(--ok-soft); color: var(--ok-ink); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  details > summary { cursor: pointer; font-weight: 600; }
  .level-bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .level-bar div { height: 100%; background: var(--gold); border-radius: 999px; }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
  .kpi b { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 600; display: block; line-height: 1.1; }
  .kpi small { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .kpi.ok b { color: var(--ok-ink); } .kpi.risk b { color: var(--risk-ink); } .kpi.tiltak b { color: var(--tiltak-ink); }

  /* ---------- home ---------- */
  .home { display: flex; flex-direction: column; gap: 18px; }
  .home-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .home-head .lead { display: flex; flex-direction: column; gap: 6px; max-width: 60ch; }
  .plist { display: flex; flex-direction: column; gap: 10px; }
  .pcard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .pcard input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }
  .pcard .pname { display: flex; flex-direction: column; gap: 2px; min-width: 0; cursor: pointer; }
  .pcard .pname b { font-size: 1.02rem; }
  .pcard .pmeta { display: flex; gap: 10px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
  .pcard .pmeta .due { color: var(--tiltak-ink); font-weight: 600; }
  .pcard .pmeta .streak { color: var(--gold-ink); font-weight: 600; }
  .pcard.off { opacity: .55; }
  .startbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .startbar .btn.primary { font-size: 1.05rem; padding: 12px 26px; }
  .resume { border: 1px dashed var(--gold); background: var(--gold-soft); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .roma-letters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .roma-letters div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); font-size: .8rem; color: var(--muted); }
  .roma-letters b { font-family: var(--font-display); font-size: 1.4rem; color: var(--accent); display: block; line-height: 1; }
  @media (max-width: 520px) { .roma-letters { grid-template-columns: repeat(2, 1fr); } }
  .pform { display: flex; flex-direction: column; gap: 12px; }

  /* ---------- project run ---------- */
  .run { display: flex; flex-direction: column; gap: 18px; }
  .strip { position: sticky; top: 56px; z-index: 5; background: var(--bg); padding-block: 8px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }
  .strip .dot { flex: 1; min-width: 0; height: 30px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); font-family: var(--font-mono); font-size: .78rem; font-weight: 600; display: grid; place-items: center; color: var(--muted); padding: 0; }
  .strip .dot.OK { background: var(--ok-soft); border-color: var(--ok); color: var(--ok-ink); }
  .strip .dot.Risiko { background: var(--risk-soft); border-color: var(--risk); color: var(--risk-ink); }
  .strip .dot.Tiltak { background: var(--tiltak-soft); border-color: var(--tiltak); color: var(--tiltak-ink); }
  .strip .dot.Skip { background: var(--skip-soft); color: var(--muted); text-decoration: line-through; }
  .run-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .pulse { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 720px) { .pulse { grid-template-columns: 1fr; } }
  .scale { display: flex; gap: 4px; }
  .scale button { flex: 1; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 6px 0; min-height: 44px; font-family: var(--font-mono); font-weight: 600; }
  .scale button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .anchor { font-size: .78rem; color: var(--muted); min-height: 1.2em; }
  .area { display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 110px; }
  .area-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
  .area-head .roma { color: var(--accent); font-family: var(--font-display); font-size: 1rem; letter-spacing: 0; text-transform: none; margin-right: 6px; }
  .area-head .acts { display: flex; gap: 8px; align-items: center; font-size: .82rem; color: var(--muted); }
  .area.skipped .qlist, .area.skipped .note { display: none; }
  .qlist { display: flex; flex-direction: column; gap: 8px; }
  .q { border: 1px solid var(--line); border-left-width: 4px; border-left-color: var(--ok); border-radius: 12px; background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .q.st-Risiko { border-left-color: var(--risk); }
  .q.st-Tiltak { border-left-color: var(--tiltak); }
  .q.cursor { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
  .q .qtext { display: flex; gap: 8px; align-items: baseline; }
  .q .qtext .n { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); min-width: 1.6em; }
  .q .qtext p { font-weight: 500; }
  .q .help { font-size: .8rem; color: var(--muted); padding-left: calc(1.6em + 8px); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; }
  .chip kbd { font-family: var(--font-mono); font-size: .66rem; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; color: var(--muted); }
  @media (hover: none) { .chip kbd { display: none; } .chip { min-height: 44px; flex: 1; justify-content: center; } }
  .chip:hover { background: var(--surface-2); }
  .chip.OK[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok-ink); }
  .chip.Risiko[aria-pressed="true"] { background: var(--risk-soft); border-color: var(--risk); color: var(--risk-ink); }
  .chip.Tiltak[aria-pressed="true"] { background: var(--tiltak-soft); border-color: var(--tiltak); color: var(--tiltak-ink); }
  .chip.opt { font-weight: 500; }
  .chip.opt[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .fields { display: flex; gap: 8px; flex-wrap: wrap; }
  .fld { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--surface-2); }
  .fld input { width: 5.5em; border: 0; background: transparent; padding: 4px; font-family: var(--font-mono); text-align: right; }
  .fld input[type="date"] { width: auto; font-family: var(--font-body); }
  .q .detail { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .q .detail textarea, .q .detail input[type="text"] { border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; width: 100%; background: var(--surface-2); }
  .q .detail textarea { min-height: 52px; resize: vertical; }
  .tiltak-grid { display: grid; grid-template-columns: 2fr 1fr auto; gap: 8px; align-items: center; }
  @media (max-width: 720px) { .tiltak-grid { grid-template-columns: 1fr; } }
  .q .last { font-size: .8rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .q .last b { color: var(--ink); font-weight: 600; }
  .frist { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .frist button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 9px; font-size: .78rem; min-height: 32px; }
  .frist button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .frist input[type="date"] { border: 1px solid var(--line-strong); border-radius: 8px; padding: 4px 6px; background: var(--surface-2); }
  .run-foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line); padding: 10px clamp(16px, 3vw, 28px); }
  .run-foot .inner { max-width: 980px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .run-foot .hint { font-size: .78rem; color: var(--muted); }
  .run-foot .hint kbd { font-family: var(--font-mono); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; font-size: .7rem; }
  @media (max-width: 640px) { .run-foot .hint { display: none; } .run-foot .inner .btn.primary { flex: 1; } }
  body.kb .run-foot { display: none; }

  /* ---------- done ---------- */
  .done { display: flex; flex-direction: column; gap: 18px; }
  .export { display: flex; flex-direction: column; gap: 10px; }
  .export .btn-row .btn { flex: 1 1 200px; }
  .summary-text { font-family: var(--font-mono); font-size: .8rem; white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; max-height: 260px; overflow: auto; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
  .psum { display: flex; flex-direction: column; gap: 10px; }
  .radar { width: 100%; max-width: 260px; margin: 0 auto; display: block; }
  .radar .grid { fill: none; stroke: var(--line); }
  .radar .axis { stroke: var(--line); }
  .radar .area-fill { fill: var(--accent); fill-opacity: .25; stroke: var(--accent); stroke-width: 2; }
  .radar .dot { fill: var(--accent); }
  .radar .dot.flag { fill: var(--risk); }
  .radar text { font-family: var(--font-body); font-size: 10px; fill: var(--muted); }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--gold); background: var(--gold-soft); border-radius: 999px; padding: 6px 12px 6px 8px; font-weight: 600; font-size: .86rem; color: var(--ink); }
  .badge i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: #1B1300; display: grid; place-items: center; font-size: .78rem; font-family: var(--font-display); }
  .badge.locked { border-color: var(--line); background: transparent; color: var(--muted); font-weight: 500; }
  .badge.locked i { background: var(--line); color: var(--muted); }

  /* ---------- overview ---------- */
  .overview { display: flex; flex-direction: column; gap: 16px; }
  .proj { display: grid; grid-template-columns: minmax(0, 1.4fr) 150px 200px; gap: 14px; align-items: center; }
  @media (max-width: 720px) { .proj { grid-template-columns: 1fr; } }
  .spark { width: 100%; height: 48px; }
  .spark path { fill: none; stroke-width: 2; }
  .spark .bel { stroke: var(--tiltak); } .spark .triv { stroke: var(--accent); } .spark .ene { stroke: var(--gold); }
  .legend { display: flex; gap: 10px; font-size: .74rem; color: var(--muted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

  ]},

      auto: f => num(f.timer_uke) > 45 ? "Krever tiltak" : num(f.timer_uke) > 40 ? "Risiko" : null },

  ]},
  { id: "merverdi", roma: "A", romaName: "Ansvar", name: "Kundebehov og merverdi", tag: "Muligheter, forlengelse, relasjon", opportunity: true, qs: [

    { id: "v2", t: "Når løper oppdraget ut, og er neste fase avklart?", help: "Kontrakt utløper om under 3 måneder, eller rammen er nesten brukt uten avklaring.", choice: [["Over 3 mnd igjen, eller avklart", "OK"], ["Under 3 mnd, dialog i gang", "Risiko"], ["Under 3 mnd, uavklart", "Krever tiltak"]], fields: [{ k: "sluttdato", l: "Sluttdato", type: "date" }], tiltak: "Avklar neste fase med kunden" },
    { id: "v3", t: "Hvem hos kunden bør Involved-ledelsen ha kontakt med, og kan kunden brukes som referanse?", help: "Beslutningstakere over ditt nivå som vi ikke kjenner.", tiltak: "Sett opp kontakt mellom Involved-ledelsen og kunden" }
  ]},
  { id: "laering", roma: "A", romaName: "Ansvar", name: "Læring og forbedring", tag: "Utvikling, erfaringsdeling, friksjon", opportunity: true, qs: [

    { id: "l2", t: "Har du erfaringer som bør deles i faggruppen?", help: "Konkrete løsninger, feil eller kundekrav andre kan lære av.", tiltak: "Del erfaring i faggruppen" },
    { id: "l3", t: "Er det noe i Involveds prosesser, maler eller verktøy som hindrer deg?", help: "OK = nei. Friksjon som gjentar seg fra måned til måned. Går til kvalitetsleder.", tiltak: "Meld forbedringsforslag til kvalitetsleder" }
  ]}
];
const AREA_BY = Object.fromEntries(AREAS.map(a => [a.id, a]));
const ALL_Q = AREAS.flatMap(a => a.qs.map(q => ({ area: a, q })));
const Q_AREA = Object.fromEntries(ALL_Q.map(x => [x.q.id, x.area]));
const Q_BY = Object.fromEntries(ALL_Q.map(x => [x.q.id, x.q]));

const PULSE = [
  { k: "belastning", name: "Belastning", anchors: ["Ledig kapasitet", "Passe", "Travelt, men håndterbart", "For mye over tid, går ut over kvalitet eller fritid", "Uholdbart, jeg klarer ikke mer"], def: 2 },
  { k: "trivsel", name: "Trivsel", anchors: ["Mistrives, vurderer å slutte", "Lav", "Grei", "God", "Svært god, anbefaler oppdraget"], def: 4 },
  { k: "energi", name: "Energi", anchors: ["Utslitt, henter meg ikke inn", "Sliten det meste av tiden", "Varierer", "Stort sett uthvilt", "Full tank"], def: 4 }
];
const LEVELS = [[0, "Peregrinus"], [400, "Legionær"], [1200, "Centurion"], [2500, "Tribun"], [5000, "Legat"], [9000, "Consul"]];
const PRIVACY_TEXT = "Tall og statuser deles kun med nærmeste leder. Pulsverdiene går i en egen ledereksport, ikke i prosjektmappen. Skriv ikke helseopplysninger, navn på personer hos kunde eller private forhold i fritekst. Ta det muntlig. Utkastet ligger bare i din nettleser til du eksporterer.";

/* ---------- hjelpere ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(n) ? 0 : n; };
const pad = n => String(n).padStart(2, "0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const isoToday = () => isoOf(new Date());
const fmtDate = iso => { if (!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return ""; const [y, m, d] = iso.slice(0, 10).split("-"); return `${d}.${m}.${y}`; };
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return isoOf(d); };
const addMonths = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setMonth(d.getMonth() + n); return isoOf(d); };
const fmtMin = s => { s = Math.max(0, Math.round(s || 0)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const uid = () => Math.random().toString(36).slice(2, 10);
const slug = s => String(s || "prosjekt").replace(/æ/gi, "ae").replace(/ø/gi, "o").replace(/å/gi, "a").normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "");
const cmp = (a, b) => String(a ?? "").localeCompare(String(b ?? ""));
function levelFor(xp) {
  let i = 0; for (let k = 0; k < LEVELS.length; k++) if (xp >= LEVELS[k][0]) i = k;
  const next = LEVELS[i + 1];
  return { name: LEVELS[i][1], next: next ? next[0] : null, pct: next ? Math.round(((xp - LEVELS[i][0]) / (next[0] - LEVELS[i][0])) * 100) : 100 };
}
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2400); }

/* ---------- lagring ---------- */
let storageBroken = false;
function emptyStore() { return { me: { konsulent: "", teamleder: "" }, projects: [], sessions: [], tiltak: [], xp: 0, best: {}, okt: null }; }
function loadStore() {
  let s = null;
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) s = JSON.parse(raw); } catch (e) { storageBroken = true; }
  if (!s || typeof s !== "object") {
    s = emptyStore();
    try { // ta med prosjekter, tiltak og XP fra v1 (spørsmålssettet er nytt, så gamle runder tas ikke med)
      const old = JSON.parse(localStorage.getItem(OLD_KEY) || "null");
      if (old && typeof old === "object") {
        (old.projects || []).forEach(p => {
          if (p && p.prosjekt) s.projects.push({ id: uid(), prosjekt: String(p.prosjekt), prosjektnummer: String(p.prosjektnummer || ""), kunde: String(p.kunde || ""), rolle: String(p.rolle || ""), kontrakt: String(p.kontrakt || ""), ku_dato: "", ku_score: "" });
          if (p && p.konsulent && !s.me.konsulent) { s.me.konsulent = String(p.konsulent); s.me.teamleder = String(p.teamleder || ""); }
        });
        (old.tiltak || []).forEach(t => { if (t && t.tekst) s.tiltak.push({ id: String(t.id || uid()), sessionId: "", projectId: (s.projects.find(p => p.prosjekt === t.prosjekt) || {}).id || "", dato: String(t.dato || isoToday()), prosjekt: String(t.prosjekt || ""), tekst: String(t.tekst), ansvarlig: String(t.ansvarlig || ""), frist: String(t.frist || ""), status: t.status === "Lukket" ? "Lukket" : "Åpen", kommentar: String(t.kommentar || ""), area: String(t.area || ""), xpGiven: true }); });
        s.xp = Number(old.xp) || 0;
      }
    } catch (e) { /* ingen v1 */ }
  }
  const d = emptyStore();
  for (const k of Object.keys(d)) if (s[k] === undefined || s[k] === null) s[k] = d[k];
  return s;
}
function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { if (!storageBroken) { storageBroken = true; toast("Lagring i nettleseren er ikke tilgjengelig. Ta JSON-sikkerhetskopi når du er ferdig."); } } }
let store = loadStore();
const projectById = id => store.projects.find(p => p.id === id);
const sessionsFor = pid => store.sessions.filter(s => s.projectId === pid).sort((a, b) => cmp(a.date, b.date) || cmp(a.finishedAt, b.finishedAt));
const lastSessionFor = pid => { const l = sessionsFor(pid); return l[l.length - 1] || null; };
const openTiltakCount = pid => store.tiltak.filter(t => t.projectId === pid && t.status === "Åpen").length;
function streakFor(pid, uptoDate) {
  const months = Array.from(new Set(sessionsFor(pid).filter(s => s.date <= uptoDate).map(s => s.date.slice(0, 7)))).sort().reverse();
  let streak = 0, cur = uptoDate.slice(0, 7);
  for (const m of months) { if (m === cur) { streak++; cur = addMonths(cur + "-15", -1).slice(0, 7); } else if (m < cur) break; }
  return streak;
}

/* ---------- økt (dagens runde) ---------- */
let okt = null;          // { id, date, queue:[pid], idx, sessions:{pid: session} }
let timerHandle = null;
let warned = false;
const cur = () => okt ? okt.sessions[okt.queue[okt.idx]] : null;

function blankAnswer() { return { status: "OK", value: "", comment: "", tiltak: "", ansvarlig: "", frist: "", oppfolging: "", fields: {}, carried: false }; }
function makeSession(project) {
  const prev = lastSessionFor(project.id);
  const answers = {};
  ALL_Q.forEach(({ q }) => {
    const a = blankAnswer();
    const pa = prev && prev.answers && prev.answers[q.id];
    if (pa) {
      a.fields = Object.assign({}, pa.fields || {});
      if (pa.status === "Risiko" || pa.status === "Krever tiltak") {
        Object.assign(a, { status: pa.status, value: pa.value || "", comment: pa.comment || "", tiltak: pa.tiltak || "", ansvarlig: pa.ansvarlig || "", frist: pa.frist || "", oppfolging: "Følges opp videre", carried: true });
      } else if (q.scale && pa.value) { a.value = pa.value; }
    }
    answers[q.id] = a;
  });
  const pulse = {};
  PULSE.forEach(p => { pulse[p.k] = prev && prev.pulse && prev.pulse[p.k] ? prev.pulse[p.k] : p.def; });
  return { id: uid(), date: isoToday(), projectId: project.id, project: Object.assign({}, project, { konsulent: store.me.konsulent, teamleder: store.me.teamleder }), pulse, answers, skipped: [], elapsedBase: 0, startedAt: Date.now(), elapsed: 0, xp: 0, badges: [], comment: "", prevId: prev ? prev.id : null };
}
function elapsedSec(s = cur()) { return s ? Math.floor((s.elapsedBase || 0) + (Date.now() - s.startedAt) / 1000) : 0; }
function saveDraft() { if (!okt) return; const s = cur(); if (s) s.elapsed = elapsedSec(s); store.okt = okt; saveStore(); }
function startTimer() { stopTimer(); timerHandle = setInterval(() => { renderHud(); const s = cur(); if (s && elapsedSec(s) >= WARN_SEC && !warned) { warned = true; toast("2 minutter igjen på dette prosjektet"); } }, 1000); }
function stopTimer() { if (timerHandle) clearInterval(timerHandle); timerHandle = null; }
let saveTick = 0;
setInterval(() => { if (okt && !$("#screen-run").hidden && ++saveTick % 10 === 0) saveDraft(); }, 1000);
document.addEventListener("visibilitychange", () => { if (document.hidden) saveDraft(); });
window.addEventListener("pagehide", saveDraft);
window.addEventListener("beforeunload", saveDraft);

/* ---------- HUD ---------- */
let hudMode = "idle";
function renderHud() {
  const hud = $("#hud");
  if (hudMode === "run" && okt) {
    const s = cur(); const el = elapsedSec(s); const left = LIMIT_SEC - el;
    const frac = Math.min(1, el / LIMIT_SEC);
    if (hud.dataset.mode !== "run") {
      hud.dataset.mode = "run";
      hud.innerHTML = `<div class="stat"><b id="hud-proj"></b><small>Prosjekt</small></div><div class="stat"><b id="hud-time" class="mono"></b><small>Igjen</small></div><div class="ring" id="hud-ring" title="10 minutter per prosjekt"><svg viewBox="0 0 40 40"><circle class="track" cx="20" cy="20" r="16"></circle><circle class="bar" cx="20" cy="20" r="16" stroke-dasharray="100.5" stroke-dashoffset="100.5"></circle></svg></div>`;
    }
    $("#hud-proj").textContent = `${okt.idx + 1}/${okt.queue.length}`;
    const t = $("#hud-time"); t.textContent = left >= 0 ? fmtMin(left) : `+${fmtMin(-left)}`; t.classList.toggle("over", left < 0);
    const ring = $("#hud-ring"); $(".bar", ring).setAttribute("stroke-dashoffset", (100.5 * (1 - frac)).toFixed(1));
    ring.classList.toggle("warn", el >= WARN_SEC && left >= 0); ring.classList.toggle("over", left < 0);
  } else {
    const lv = levelFor(store.xp);
    hud.dataset.mode = "idle";

}

/* ---------- navigasjon ---------- */

function startOkt(ids) {
  okt = { id: uid(), date: isoToday(), queue: ids, idx: 0, sessions: {} };
  ids.forEach(pid => { okt.sessions[pid] = makeSession(projectById(pid)); });
  okt.sessions[ids[0]].startedAt = Date.now();
  warned = false; saveDraft(); startTimer(); renderRun();
}

/* =====================================================================
   PROSJEKT — én skjerm, alt grønt til du flagger
   ===================================================================== */
function areaState(s, area) {
  if (s.skipped.includes(area.id)) return "Skip";
  let st = "OK";
  area.qs.forEach(q => { const a = s.answers[q.id].status; if (a === "Krever tiltak") st = "Tiltak"; else if (a === "Risiko" && st !== "Tiltak") st = "Risiko"; });
  return st;
}
function renderStrip(s) {
  const strip = $("#strip"); if (!strip) return;
  strip.innerHTML = AREAS.map((a, i) => `<button type="button" class="dot ${areaState(s, a)}" data-goto="${a.id}" title="${esc(a.name)}" aria-label="${esc(a.name)}">${i + 1}</button>`).join("");
  $$("[data-goto]", strip).forEach(b => b.addEventListener("click", () => { $(`#area-${b.dataset.goto}`).scrollIntoView({ block: "start" }); }));
}
function countFlags(sess) { return Object.values(sess.answers).filter(a => a.status === "Risiko" || a.status === "Krever tiltak").length; }
function updateCount(s, a) {
  const c = $(`#cnt-${a.id}`); if (!c) return;
  const f = a.qs.filter(q => ["Risiko", "Krever tiltak"].includes(s.answers[q.id].status)).length;
  c.textContent = s.skipped.includes(a.id) ? "hoppet over" : f ? `${f} flagget` : "alt grønt";
}

  $$("[data-skip]", el).forEach(b => b.addEventListener("click", () => { const id = b.dataset.skip; const i = s.skipped.indexOf(id); if (i >= 0) s.skipped.splice(i, 1); else s.skipped.push(id); $(`#area-${id}`).classList.toggle("skipped", i < 0); b.textContent = i < 0 ? "Ta med likevel" : "Hopp over denne måneden"; updateCount(s, AREA_BY[id]); renderStrip(s); saveDraft(); }));

function renderRow(s, a, q, i) {
  const ans = s.answers[q.id]; const flagged = ans.status === "Risiko" || ans.status === "Krever tiltak";
  const prev = s.prevId ? store.sessions.find(x => x.id === s.prevId) : null; const pa = prev && prev.answers[q.id];
  const chips = STATUS.map((st, k) => `<button type="button" class="chip ${SC[st]}" data-status="${esc(st)}" aria-pressed="${ans.status === st}"><kbd>${k + 1}</kbd>${st === "Krever tiltak" ? "Tiltak" : st}</button>`).join("");
  const choice = q.choice ? `<div class="chips">${q.choice.map(([lab, st]) => `<button type="button" class="chip opt" data-opt="${esc(lab)}" data-optstatus="${esc(st)}" aria-pressed="${ans.value === lab}">${esc(lab)}</button>`).join("")}</div>` : "";
  const scale = q.scale ? `<div class="chips" title="${esc(SCALE_HELP)}">${SCALE.map(([v, lab, st]) => `<button type="button" class="chip opt" data-opt="${v}" data-optstatus="${st}" aria-pressed="${String(ans.value) === String(v)}">${v} ${lab}</button>`).join("")}</div>` : "";
  const fields = q.fields ? `<div class="fields">${q.fields.map(f => `<label class="fld"><span>${esc(f.l)}</span><input type="${f.type || "number"}" ${f.type ? "" : 'inputmode="decimal" step="any"'} data-fld="${f.k}" value="${esc(ans.fields[f.k] || "")}">${f.u ? `<em>${esc(f.u)}</em>` : ""}</label>`).join("")}</div>` : "";
  const lastNote = ans.carried && pa ? `<div class="last">Sist: <span class="pill ${SC[pa.status]}">${esc(pa.status)}</span>${pa.comment ? `<b>${esc(pa.comment)}</b>` : ""}<button type="button" class="btn ghost small" data-resolved>Løst nå</button></div>` : "";
  const fristOpts = [["+1 uke", addDays(s.date, 7)], ["+2 uker", addDays(s.date, 14)], ["Neste ROMA", addMonths(s.date, 1)]];
  let detail = "";
  if (flagged) {
    detail = `<div class="detail">
      <textarea data-field="comment" placeholder="${q.sensitive ? "Kort, uten navn. Detaljene tas muntlig." : "Hva skjer? Én setning."}" aria-label="Kommentar">${esc(ans.comment)}</textarea>
      ${q.sensitive && ans.status === "Krever tiltak" ? `<p class="note red small">Dette går til varslingsrutinen, ikke tiltaksloggen. Leder tar kontakt innen én uke.</p>` : `<div class="tiltak-grid">
        <input type="text" data-field="tiltak" placeholder="Tiltak" value="${esc(ans.tiltak)}" aria-label="Tiltak">
        <input type="text" data-field="ansvarlig" placeholder="Ansvarlig" value="${esc(ans.ansvarlig)}" aria-label="Ansvarlig">
        <div class="frist" role="group" aria-label="Frist">${fristOpts.map(([lab, d]) => `<button type="button" data-frist="${d}" aria-pressed="${ans.frist === d}">${lab}</button>`).join("")}<input type="date" data-field="frist" value="${esc(ans.frist)}" aria-label="Frist, dato"></div>
      </div>
      <div class="chips"><button type="button" class="chip opt" data-opp="Følges opp videre" aria-pressed="${ans.oppfolging !== "Avklart"}">Følg opp</button><button type="button" class="chip opt" data-opp="Avklart" aria-pressed="${ans.oppfolging === "Avklart"}">Avklart i samtalen</button></div>`}
    </div>`;
  } else if (q.commentOnOk) {
    detail = `<div class="detail" style="border-top:0;padding-top:0"><input type="text" data-field="comment" placeholder="${q.scale ? "Grunnlag, én setning" : "Eksempel, én setning"}" value="${esc(ans.comment)}" aria-label="Kommentar"></div>`;
  }
  return `<div class="q st-${SC[ans.status]}" data-q="${q.id}" tabindex="-1">
    <div class="qtext"><span class="n">${i + 1}</span><p>${esc(q.t)}</p></div>
    <div class="help">${esc(q.help)}</div>
    ${choice}${scale}${fields}
    <div class="chips">${chips}</div>

  </div>`;
}

function rerender(s, q) {
  const a = Q_AREA[q.id]; const i = a.qs.indexOf(q);
  const old = $(`.q[data-q="${q.id}"]`); if (!old) return; const hadCursor = old.classList.contains("cursor");
  const tmp = document.createElement("div"); tmp.innerHTML = renderRow(s, a, q, i);
  const fresh = tmp.firstElementChild; old.replaceWith(fresh); if (hadCursor) { fresh.classList.add("cursor"); cursorRow = fresh; }
  bindRow(s, a, q); updateCount(s, a); renderStrip(s);
}
function setStatus(s, q, status, opts = {}) {
  const ans = s.answers[q.id]; const was = ans.status;
  ans.status = status; ans.carried = false;
  if (status !== "OK") {
    if (!ans.frist) ans.frist = addDays(s.date, 14);
    if (!ans.oppfolging) ans.oppfolging = "Følges opp videre";
    if (!ans.ansvarlig) ans.ansvarlig = store.me.konsulent;
    if (status === "Krever tiltak" && !ans.tiltak && q.tiltak) ans.tiltak = q.tiltak;
  } else { ans.tiltak = ""; ans.frist = ""; ans.oppfolging = ""; ans.ansvarlig = ""; if (!q.commentOnOk) ans.comment = ""; }
  saveDraft(); rerender(s, q);
  const row = $(`.q[data-q="${q.id}"]`);
  if (status !== "OK" && was === "OK" && !opts.quiet) { const ta = $("textarea", row); if (ta && matchMedia("(hover: hover)").matches) ta.focus(); }
  else if (opts.focusChip) { const b = $(`[data-status="${status}"]`, row); if (b) b.focus(); }
}
function bindRow(s, a, q) {
  const row = $(`.q[data-q="${q.id}"]`); if (!row) return; const ans = s.answers[q.id];

function collect(s) {

  AREAS.forEach(a => a.qs.forEach(q => {
    const ans = s.answers[q.id]; const skipped = (s.skipped || []).includes(a.id);
    const status = skipped ? SKIP : ans.status;

    if (!skipped && status !== "OK" && ((ans.tiltak || "").trim() || status === "Krever tiltak") && !q.sensitive) {

}

  if (num(F("o3").endringstimer) > 20 || A.o3.status === "Krever tiltak") f.push("Arbeid utenfor avtalt omfang uten skriftlig bestilling");
  if (A.o4.status === "Krever tiltak") f.push("Rolle eller ansvar som ikke dekkes av kontrakt og forsikring");
  if (p.kontrakt && p.kontrakt !== "Ja") f.push("Kontrakt ikke signert og lagret på SharePoint");

  if (pv.belastning >= 4) w.push(`Belastning ${pv.belastning}/5: leder avtaler samtale innen én uke${twice("belastning") ? ". To måneder på rad: skriftlig tiltak i tiltaksloggen" : ""}`);
  if (pv.energi <= 2) w.push(`Energi ${pv.energi}/5: leder avtaler samtale innen én uke${twice("energi") ? ". To måneder på rad: skriftlig tiltak" : ""}`);

}

  return [["INVOLVED ROMA-SAMTALE – VEILEDNING"], ["Formål\nROMA-samtalen er Involveds strukturerte prosjektsamtale for oppfølging av både prosjektet og menneskene bak. R Ressurs · O Oversikt · M Menneske · A Ansvar.\n\nFrekvens: Månedlig\nVarighet: 10 minutter per prosjekt\nGjennomføres av: Nærmeste leder og ressurs i prosjektet\n\nOmråder:\n" + AREAS.map((a, i) => `${i + 1}. ${a.name} – ${a.tag}`).join("\n") + "\n\nStatus: OK / Risiko / Krever tiltak / Ikke gjennomgått. Under Kundebehov og merverdi og Læring og forbedring betyr «Krever tiltak» en mulighet som følges opp.\nPulsverdier (belastning, trivsel, energi) ligger i egen ledereksport, ikke i prosjektmappen.\n\nGenerert av Via ROMA."]];
}
function infoRows(sessions) {
  const rows = [["Konsulent", "Teamleder", "Prosjekt", "Prosjektnummer", "Kunde", "Rolle", "Kontrakt signert og lagret på SP?", "Kundeundersøkelse sendt", "Score siste kundeundersøkelse"]];
  const seen = new Set();
  sessions.forEach(s => { if (seen.has(s.projectId)) return; seen.add(s.projectId); const p = s.project; rows.push([p.konsulent, p.teamleder, p.prosjekt, p.prosjektnummer, p.kunde, p.rolle, p.kontrakt, fmtDate(p.ku_dato), p.ku_score]); });
  return rows;
}
function skjemaRows(sessions) {
  const rows = [["Dato", "Tema", "Spørsmål", "Status / Kommentar", "Tiltak / Ansvar", "Frist", "Avklart trenger ikke oppfølging", "Status (OK/Risiko/Tiltak)", "Verdi"]];
  sessions.forEach(s => {
    AREAS.forEach(a => {
      const skipped = (s.skipped || []).includes(a.id);
      rows.push([fmtDate(s.date), a.name, "", skipped ? "Ikke gjennomgått denne måneden" : "", "", "", "", skipped ? SKIP : "", ""]);
      a.qs.forEach(q => {
        const ans = s.answers[q.id]; const st = skipped ? SKIP : ans.status; const flagged = st === "Risiko" || st === "Krever tiltak";
        const hidden = q.sensitive && flagged;
        rows.push([fmtDate(s.date), a.name, q.t, hidden ? "Håndteres i varslingsrutinen" : (skipped ? "" : ans.comment), hidden || !flagged ? "" : (ans.tiltak ? `${ans.tiltak}${ans.ansvarlig ? " / " + ans.ansvarlig : ""}` : ""), hidden || !flagged ? "" : fmtDate(ans.frist), flagged ? ans.oppfolging : "", st, skipped ? "" : fieldText(q, ans)]);
      });
    });
    if (s.comment) rows.push([fmtDate(s.date), "Oppsummering", "", s.comment, "", "", "", "", ""]);
    const flags = redFlags(s); if (flags.length) rows.push([fmtDate(s.date), "Røde flagg", "", flags.join(" · "), "Meldt til leder / Planner", "", "", "Krever tiltak", ""]);
  });
  return rows;
}
function tiltakRows(list) {
  const rows = [["Dato opprettet", "Prosjekt", "Tiltak", "Ansvarlig", "Frist", "Status (åpen/lukket)", "Kommentar / oppfølging"]];
  list.forEach(t => rows.push([fmtDate(t.dato), t.prosjekt, t.tekst, t.ansvarlig, fmtDate(t.frist), t.status, [t.area, t.kommentar].filter(Boolean).join(": ")]));
  return rows;
}
function statusRows(sessions, withPulse) {
  const rows = [["Dato", "Konsulent", "Prosjekt", "Sist samtale", "Neste samtale", "Antall åpne tiltak", "Belastning (1–5)", "Trivsel (1–5)", "Energi (1–5)", "Kommentar"]];
  sessions.forEach(s => {
    const prev = sessionsFor(s.projectId).filter(x => x.id !== s.id && (x.date < s.date || (x.date === s.date && (x.finishedAt || "") < (s.finishedAt || "")))).pop();
    rows.push([fmtDate(s.date), s.project.konsulent, s.project.prosjekt, prev ? fmtDate(prev.date) : "", fmtDate(addMonths(s.date, 1)), openTiltakCount(s.projectId), withPulse ? s.pulse.belastning : "se ledereksport", withPulse ? s.pulse.trivsel : "se ledereksport", withPulse ? (s.pulse.energi || "") : "se ledereksport", withPulse ? [s.comment, ...pulseWarnings(s)].filter(Boolean).join(" · ") : (s.comment || "")]);
  });
  return rows;
}
function buildProjectWorkbook(s) {
  const wb = XLSX.utils.book_new();
  sheet(wb, "Forside", forsideRows(), [110]);
  sheet(wb, "Prosjektinfo", infoRows([s]), [18, 18, 26, 14, 22, 18, 30, 16, 16]);
  sheet(wb, "ROMA-samtale", skjemaRows([s]), [11, 24, 60, 40, 36, 11, 26, 22, 30]);
  sheet(wb, "Tiltak & Oppfølging", tiltakRows(store.tiltak.filter(t => t.projectId === s.projectId)), [13, 24, 50, 18, 11, 18, 40]);
  sheet(wb, "Statusoversikt", statusRows([s], false), [11, 18, 24, 12, 12, 16, 16, 16, 16, 40]);
  return wb;
}
function buildLeaderWorkbook(sessions) {
  const wb = XLSX.utils.book_new();
  const sorted = sessions.slice().sort((a, b) => cmp(a.date, b.date) || cmp(a.project.prosjekt, b.project.prosjekt));
  sheet(wb, "Statusoversikt", statusRows(sorted, true), [11, 18, 24, 12, 12, 16, 16, 16, 16, 50]);
  const puls = [["Dato", "Konsulent", "Prosjekt", "Belastning (1–5)", "Trivsel (1–5)", "Energi (1–5)", "Varsel", "Røde flagg"]];
  sorted.forEach(s => puls.push([fmtDate(s.date), s.project.konsulent, s.project.prosjekt, s.pulse.belastning, s.pulse.trivsel, s.pulse.energi || "", pulseWarnings(s).join(" · "), redFlags(s).join(" · ")]));
  sheet(wb, "Puls", puls, [11, 18, 24, 16, 16, 16, 60, 60]);
  sheet(wb, "Tiltak & Oppfølging", tiltakRows(store.tiltak.filter(t => sorted.some(s => s.projectId === t.projectId))), [13, 24, 50, 18, 11, 18, 40]);
  sheet(wb, "ROMA-samtale", skjemaRows(sorted), [11, 24, 60, 40, 36, 11, 26, 22, 30]);
  return wb;
}
function xlsxBlob(wb) { return new Blob([XLSX.write(wb, { type: "array", bookType: "xlsx" })], { type: XLSX_MIME }); }
async function exportProject(s) {
  if (!window.XLSX) { toast("Excel-biblioteket er ikke lastet. Sjekk nett og prøv igjen."); return false; }
  try { return await saveFile(`${s.date.replace(/-/g, "")}_Involved_ROMAsamtale_${slug(s.project.prosjekt)}_${slug(s.project.konsulent)}.xlsx`, xlsxBlob(buildProjectWorkbook(s))); }
  catch (e) { console.error(e); toast("Excel-eksport feilet. Bruk «Kopier til Teams»."); return false; }
}
async function exportLeader(sessions) {
  if (!window.XLSX) { toast("Excel-biblioteket er ikke lastet. Sjekk nett og prøv igjen."); return false; }
  if (!sessions.length) { toast("Ingen runder å eksportere ennå"); return false; }
  try { return await saveFile(`${isoToday().replace(/-/g, "")}_Involved_ROMA_lederoversikt_${slug(store.me.konsulent)}.xlsx`, xlsxBlob(buildLeaderWorkbook(sessions))); }
  catch (e) { console.error(e); toast("Excel-eksport feilet."); return false; }
}

function sparkSvg(list) {
  const w = 200, h = 48, pad = 5; const pts = list.slice(-8); if (!pts.length) return "";
  const x = i => pts.length === 1 ? w / 2 : pad + (i * (w - 2 * pad)) / (pts.length - 1);
  const y = v => h - pad - (((v || 3) - 1) / 4) * (h - 2 * pad);
  const path = k => pts.map((s, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(s.pulse[k]).toFixed(1)}`).join(" ");
  const li = pts.length - 1; const last = pts[li];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Trend for belastning, trivsel og energi"><path class="bel" d="${path("belastning")}"></path><path class="triv" d="${path("trivsel")}"></path><path class="ene" d="${path("energi")}"></path><circle style="fill:var(--tiltak)" cx="${x(li).toFixed(1)}" cy="${y(last.pulse.belastning).toFixed(1)}" r="3"></circle><circle style="fill:var(--accent)" cx="${x(li).toFixed(1)}" cy="${y(last.pulse.trivsel).toFixed(1)}" r="3"></circle><circle style="fill:var(--gold)" cx="${x(li).toFixed(1)}" cy="${y(last.pulse.energi).toFixed(1)}" r="3"></circle></svg>`;
}
function validSession(s) {
  if (!s || typeof s !== "object" || typeof s.id !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(String(s.date)) || !s.project || typeof s.project !== "object" || !s.answers || typeof s.answers !== "object") return null;
  const o = { id: s.id, date: s.date, projectId: String(s.projectId || ""), project: {}, pulse: {}, answers: {}, skipped: Array.isArray(s.skipped) ? s.skipped.filter(x => AREA_BY[x]) : [], elapsed: Number(s.elapsed) || 0, xp: Number(s.xp) || 0, badges: Array.isArray(s.badges) ? s.badges.map(String) : [], comment: String(s.comment || ""), finishedAt: String(s.finishedAt || ""), prevId: s.prevId ? String(s.prevId) : null };
  ["konsulent", "teamleder", "prosjekt", "prosjektnummer", "kunde", "rolle", "kontrakt", "ku_dato", "ku_score", "id"].forEach(k => { o.project[k] = String(s.project[k] || ""); });
  PULSE.forEach(p => { const v = Number(s.pulse && s.pulse[p.k]); o.pulse[p.k] = v >= 1 && v <= 5 ? v : p.def; });
  ALL_Q.forEach(({ q }) => { const a = (s.answers[q.id] && typeof s.answers[q.id] === "object") ? s.answers[q.id] : {}; const b = blankAnswer(); b.status = STATUS.includes(a.status) ? a.status : "OK"; ["value", "comment", "tiltak", "ansvarlig", "frist", "oppfolging"].forEach(k => { b[k] = String(a[k] || ""); }); b.fields = a.fields && typeof a.fields === "object" ? Object.fromEntries(Object.entries(a.fields).map(([k, v]) => [String(k), String(v)])) : {}; o.answers[q.id] = b; });
  return o;
}
function renderOverview() {
  if (okt) { saveDraft(); stopTimer(); okt = null; }
  hudMode = "idle"; renderHud(); show("overview");
  const el = $("#screen-overview"); const today = isoToday(); const lv = levelFor(store.xp);
  const openT = store.tiltak.filter(t => t.status === "Åpen");
  el.innerHTML = `
    <div class="overview">
      <div class="area-head">
        <div><span class="eyebrow">Statusoversikt</span><h2>Dine prosjekter</h2><p class="muted">${store.sessions.length} runder · ${store.xp} XP · nivå ${esc(lv.name)}${lv.next ? ` · ${lv.next - store.xp} XP til neste` : ""}</p></div>
        <div class="btn-row">
          <button type="button" class="btn" id="all-leder-btn" ${store.sessions.length ? "" : "disabled"}>Ledereksport, alle runder</button>
          <button type="button" class="btn ghost" id="backup-btn">Sikkerhetskopi (JSON)</button>
          <button type="button" class="btn ghost" id="import-btn">Hent sikkerhetskopi</button><input type="file" id="import-inp" accept="application/json" hidden>
        </div>
      </div>
      <div class="level-bar" aria-hidden="true"><div style="width:${lv.pct}%"></div></div>

      ${store.projects.length ? store.projects.map(p => {
        const list = sessionsFor(p.id); const last = list[list.length - 1]; const next = last ? addMonths(last.date, 1) : null; const overdue = next && next < today; const open = openTiltakCount(p.id);
        return `<div class="card proj">
          <div><b>${esc(p.prosjekt)}</b><br><span class="muted small">${esc(p.kunde)}</span><br><span class="small">${last ? `sist <b class="mono">${fmtDate(last.date)}</b> · neste <b class="mono" style="${overdue ? "color:var(--tiltak-ink)" : ""}">${fmtDate(next)}</b>${overdue ? " · forfalt" : ""}${streakFor(p.id, last.date) >= 2 ? ` · streak ×${streakFor(p.id, last.date)}` : ""}${store.best[p.id] ? ` · rekord ${fmtMin(store.best[p.id])}` : ""}` : "ingen runder ennå"}</span></div>
          <div class="kpi ${open ? "tiltak" : "ok"}"><b>${open}</b><small>Åpne tiltak</small></div>
          <div>${last ? sparkSvg(list) + `<div class="legend"><span><i style="background:var(--tiltak)"></i>Belastning ${last.pulse.belastning}</span><span><i style="background:var(--accent)"></i>Trivsel ${last.pulse.trivsel}</span><span><i style="background:var(--gold)"></i>Energi ${last.pulse.energi || "–"}</span></div>` : ""}</div>
        </div>`; }).join("") : `<div class="empty">Ingen prosjekter ennå. Legg til det første på forsiden.</div>`}

      <div class="card">
        <div class="area-head" style="margin-bottom:8px"><h3>Tiltakslogg</h3><span class="muted small">${openT.length} åpne · huk av når det er lukket</span></div>
        ${store.tiltak.length ? `<div class="table-wrap"><table><thead><tr><th></th><th>Opprettet</th><th>Prosjekt</th><th>Tiltak</th><th>Ansvarlig</th><th>Frist</th><th>Status</th></tr></thead><tbody>
          ${store.tiltak.slice().sort((a, b) => (a.status === b.status ? cmp(a.frist || "9", b.frist || "9") : a.status === "Åpen" ? -1 : 1)).map(t => `<tr>
            <td><input type="checkbox" data-tiltak="${esc(t.id)}" ${t.status === "Lukket" ? "checked" : ""} aria-label="Lukk tiltak"></td>
            <td class="mono">${fmtDate(t.dato)}</td><td>${esc(t.prosjekt)}</td><td>${esc(t.tekst)}<br><span class="muted small">${esc(t.area)}${t.kommentar ? " · " + esc(t.kommentar) : ""}</span></td><td>${esc(t.ansvarlig)}</td>
            <td class="mono" style="${t.status === "Åpen" && t.frist && t.frist < today ? "color:var(--tiltak-ink)" : ""}">${fmtDate(t.frist)}</td>
            <td><span class="pill ${t.status === "Åpen" ? "open" : "closed"}">${esc(t.status)}</span></td></tr>`).join("")}
        </tbody></table></div>` : `<p class="muted">Ingen tiltak logget ennå.</p>`}
      </div>

      ${store.sessions.length ? `<div class="card">
        <div class="area-head" style="margin-bottom:8px"><h3>Gjennomførte runder</h3></div>
        <div class="table-wrap"><table><thead><tr><th>Dato</th><th>Prosjekt</th><th>OK / Risiko / Tiltak</th><th>Tid</th><th>XP</th><th></th></tr></thead><tbody>
          ${store.sessions.slice().sort((a, b) => cmp(b.date, a.date) || cmp(b.finishedAt, a.finishedAt)).map(s => { const c = { OK: 0, Risiko: 0, "Krever tiltak": 0 }; collect(s).rows.forEach(r => { if (c[r.status] !== undefined) c[r.status]++; }); return `<tr><td class="mono">${fmtDate(s.date)}</td><td>${esc(s.project.prosjekt)}</td><td class="mono"><span style="color:var(--ok-ink)">${c.OK}</span> / <span style="color:var(--risk-ink)">${c.Risiko}</span> / <span style="color:var(--tiltak-ink)">${c["Krever tiltak"]}</span></td><td class="mono">${fmtMin(s.elapsed)}</td><td class="mono">${Number(s.xp) || 0}</td><td><button type="button" class="btn small" data-open="${esc(s.id)}">Åpne</button></td></tr>`; }).join("")}
        </tbody></table></div>
      </div>` : ""}
      <p class="note privacy muted small">${esc(PRIVACY_TEXT)} Alt lagres kun i denne nettleseren. Ta sikkerhetskopi før du bytter maskin.</p>
    </div>`;
  $("#all-leder-btn", el).addEventListener("click", () => exportLeader(store.sessions));
  $("#backup-btn", el).addEventListener("click", () => saveFile(`${isoToday().replace(/-/g, "")}_ViaROMA_sikkerhetskopi.json`, JSON.stringify(store, null, 2)));
  $("#import-btn", el).addEventListener("click", () => $("#import-inp", el).click());
  $("#import-inp", el).addEventListener("change", ev => {
    const f = ev.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result); if (!data || typeof data !== "object") throw new Error("format");
        let n = 0;
        (Array.isArray(data.projects) ? data.projects : []).forEach(p => { if (p && typeof p === "object" && p.prosjekt && !store.projects.some(x => x.id === p.id)) { const o = { id: String(p.id || uid()) }; ["prosjekt", "kunde", "prosjektnummer", "rolle", "kontrakt", "ku_dato", "ku_score"].forEach(k => { o[k] = String(p[k] || ""); }); store.projects.push(o); } });
        const have = new Set(store.sessions.map(s => s.id));
        (Array.isArray(data.sessions) ? data.sessions : []).forEach(s => { const v = validSession(s); if (v && !have.has(v.id) && (projectById(v.projectId) || v.project.prosjekt)) { if (!projectById(v.projectId)) { const np = Object.assign({ id: v.projectId || uid() }, v.project); v.projectId = np.id; store.projects.push(np); } store.sessions.push(v); store.xp += v.xp; n++; } });
        const haveT = new Set(store.tiltak.map(t => t.id));
        (Array.isArray(data.tiltak) ? data.tiltak : []).forEach(t => { if (t && typeof t === "object" && t.tekst && !haveT.has(String(t.id))) store.tiltak.push({ id: String(t.id || uid()), sessionId: String(t.sessionId || ""), projectId: String(t.projectId || ""), dato: /^\d{4}-\d{2}-\d{2}$/.test(String(t.dato)) ? t.dato : isoToday(), prosjekt: String(t.prosjekt || ""), tekst: String(t.tekst), ansvarlig: String(t.ansvarlig || ""), frist: /^\d{4}-\d{2}-\d{2}$/.test(String(t.frist)) ? t.frist : "", status: t.status === "Lukket" ? "Lukket" : "Åpen", kommentar: String(t.kommentar || ""), area: String(t.area || ""), xpGiven: !!t.xpGiven }); });
        if (data.me && typeof data.me === "object" && !store.me.konsulent) { store.me.konsulent = String(data.me.konsulent || ""); store.me.teamleder = String(data.me.teamleder || ""); }
        if (data.best && typeof data.best === "object") Object.entries(data.best).forEach(([k, v]) => { if (Number(v) > 0 && (!store.best[k] || Number(v) < store.best[k])) store.best[k] = Number(v); });
        saveStore(); toast(`Hentet ${n} runder`); renderOverview();
      } catch (e) { toast("Kunne ikke lese filen"); }
    };
    r.readAsText(f);
  });
  $$("[data-tiltak]", el).forEach(cb => cb.addEventListener("change", () => {
    const t = store.tiltak.find(x => x.id === cb.dataset.tiltak); if (!t) return;
    t.status = cb.checked ? "Lukket" : "Åpen"; if (cb.checked && !t.xpGiven) { t.xpGiven = true; store.xp += 10; toast("Tiltak lukket · +10 XP"); }
    saveStore(); renderOverview();
  }));
  $$("[data-open]", el).forEach(b => b.addEventListener("click", () => { const s = store.sessions.find(x => x.id === b.dataset.open); if (s) renderDone([s]); }));
}
