<style>
  :root {
    --bg: #EDF0EC; --surface: #FFFFFF; --surface-2: #F5F7F4; --line: #D4DAD5; --line-strong: #B9C2BB;

    --risk: #C9931E; --risk-soft: #FBF0D2; --risk-ink: #7A5600;
    --tiltak: #C94B3D; --tiltak-soft: #F9E0DC; --tiltak-ink: #9A2F24;

    --shadow: 0 10px 30px -18px rgba(23, 32, 38, .35); --radius: 14px;
    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1719; --surface: #16232A; --surface-2: #1D2C33; --line: #2C3D44; --line-strong: #3F535B;
      --ink: #E6EDEA; --muted: #93A5A6;
      --accent: #4FB3A0; --accent-ink: #0B1A18; --accent-soft: #1B3A37;
      --gold: #E1AF4B; --gold-soft: #3A2F16; --gold-ink: #F1D48C;
      --ok: #5CC189; --ok-soft: #1B3527; --ok-ink: #9FE0BA;
      --risk: #E4B54A; --risk-soft: #3B311A; --risk-ink: #F3D48A;
      --tiltak: #E8735F; --tiltak-soft: #402220; --tiltak-ink: #F5B0A3;
      --skip: #93A5A6; --skip-soft: #24343A;
      --shadow: 0 10px 30px -18px rgba(0, 0, 0, .8);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1719; --surface: #16232A; --surface-2: #1D2C33; --line: #2C3D44; --line-strong: #3F535B;
    --ink: #E6EDEA; --muted: #93A5A6;
    --accent: #4FB3A0; --accent-ink: #0B1A18; --accent-soft: #1B3A37;
    --gold: #E1AF4B; --gold-soft: #3A2F16; --gold-ink: #F1D48C;
    --ok: #5CC189; --ok-soft: #1B3527; --ok-ink: #9FE0BA;
    --risk: #E4B54A; --risk-soft: #3B311A; --risk-ink: #F3D48A;
    --tiltak: #E8735F; --tiltak-soft: #402220; --tiltak-ink: #F5B0A3;
    --skip: #93A5A6; --skip-soft: #24343A;
    --shadow: 0 10px 30px -18px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); }
  h2 { font-size: clamp(1.2rem, 2.4vw, 1.5rem); }
  h3 { font-size: 1.05rem; }
  p { margin: 0; }

  .eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
  .small { font-size: .85rem; }
  #app { max-width: 860px; margin: 0 auto; padding-block: 0 90px; padding-inline: clamp(16px, 3vw, 28px); }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 6; background: var(--bg); min-height: 54px; }
  .brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }

  @media (max-width: 560px) { .brand span { display: none; } .tab { padding: 6px 9px; font-size: .9rem; } }

  main { padding-block: 18px; }
  section[hidden], [hidden] { display: none !important; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; min-height: 44px; transition: transform .08s ease, background .15s ease; }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label, .field legend { font-size: .8rem; font-weight: 600; color: var(--muted); padding: 0; }
  .field input, .field select, .field textarea { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 9px; padding: 9px 11px; width: 100%; }
  .field textarea { min-height: 60px; resize: vertical; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } input, select, textarea { font-size: 16px; } }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; transition: all .25s ease; pointer-events: none; z-index: 20; box-shadow: var(--shadow); max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .note { border-radius: 10px; padding: 10px 14px; font-size: .88rem; border: 1px solid var(--line); background: var(--surface-2); }
  .note.gold { background: var(--gold-soft); border-color: var(--gold); color: var(--ink); }
  .note.red { background: var(--tiltak-soft); border-color: var(--tiltak); }
  .note.privacy { border-style: dashed; }
  .note ul { margin: 6px 0 0; padding-left: 20px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
  .pill.open { background: var(--tiltak-soft); color: var(--tiltak-ink); }
  .pill.closed { background: var(--ok-soft); color: var(--ok-ink); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  details > summary { cursor: pointer; font-weight: 600; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
  .kpi b { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 600; display: block; line-height: 1.1; }
  .kpi small { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .kpi.ok b { color: var(--ok-ink); } .kpi.tiltak b { color: var(--tiltak-ink); }

  .home { display: flex; flex-direction: column; gap: 16px; }
  .home-head { display: flex; flex-direction: column; gap: 6px; max-width: 60ch; }
  .plist { display: flex; flex-direction: column; gap: 10px; }
  .pcard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .pcard input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }
  .pcard .pname { display: flex; flex-direction: column; gap: 2px; min-width: 0; cursor: pointer; }
  .pcard .pname b { font-size: 1.02rem; }
  .pcard .pmeta { display: flex; gap: 10px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
  .pcard .pmeta .due { color: var(--tiltak-ink); font-weight: 600; }
  .pcard .pmeta .streak { color: var(--gold-ink); font-weight: 600; }
  .pcard.off { opacity: .55; }
  .startbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .startbar .btn.primary { font-size: 1.05rem; padding: 12px 26px; }
  .resume { border: 1px dashed var(--gold); background: var(--gold-soft); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .roma-letters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .roma-letters div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); font-size: .8rem; color: var(--muted); }
  .roma-letters b { font-family: var(--font-display); font-size: 1.4rem; color: var(--accent); display: block; line-height: 1; }
  @media (max-width: 520px) { .roma-letters { grid-template-columns: repeat(2, 1fr); } }
  .pform { display: flex; flex-direction: column; gap: 12px; }
  .pulse { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 560px) { .pulse { grid-template-columns: 1fr; } }
  .scale { display: flex; gap: 4px; }
  .scale button { flex: 1; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 6px 0; min-height: 42px; font-family: var(--font-mono); font-weight: 600; }
  .scale button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .anchor { font-size: .78rem; color: var(--muted); min-height: 1.2em; }

  .run { display: flex; flex-direction: column; gap: 14px; }
  .run-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .lastbox { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--surface-2); font-size: .9rem; }
  .lights-mini { display: inline-flex; gap: 3px; vertical-align: middle; }
  .lights-mini i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; background: var(--line-strong); }
  .lights-mini i.OK { background: var(--ok); } .lights-mini i.Risiko { background: var(--risk); } .lights-mini i.Tiltak { background: var(--tiltak); }
  .siglist { display: flex; flex-direction: column; gap: 8px; }
  .sig { border: 1px solid var(--line); border-left-width: 5px; border-left-color: var(--ok); border-radius: 12px; background: var(--surface); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
  .sig.st-Risiko { border-left-color: var(--risk); }
  .sig.st-Tiltak { border-left-color: var(--tiltak); }
  .sig.cursor { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
  .sig-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  @media (max-width: 560px) { .sig-main { grid-template-columns: 1fr; } }
  .sig-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .sig-text .lbl { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .sig-text .lbl .roma { color: var(--accent); font-family: var(--font-display); font-weight: 700; }
  .sig-text .lbl b { font-size: .95rem; }
  .sig-text .lbl .sist { font-size: .74rem; color: var(--muted); }
  .sig-text .lbl .chg { font-size: .72rem; color: var(--gold-ink); font-weight: 600; }
  .sig-text p { font-size: .92rem; }
  .lights { display: flex; gap: 6px; }
  .light { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; min-height: 40px; padding: 4px 12px; display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: .85rem; color: var(--muted); }
  .light i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; background: var(--line-strong); }
  .light.OK i { background: var(--ok); } .light.Risiko i { background: var(--risk); } .light.Tiltak i { background: var(--tiltak); }
  .light[aria-pressed="true"] { color: var(--ink); }
  .light.OK[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); }
  .light.Risiko[aria-pressed="true"] { background: var(--risk-soft); border-color: var(--risk); }
  .light.Tiltak[aria-pressed="true"] { background: var(--tiltak-soft); border-color: var(--tiltak); }
  .light kbd { font-family: var(--font-mono); font-size: .66rem; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; color: var(--muted); }
  @media (hover: none) { .light kbd { display: none; } .lights { width: 100%; } .light { flex: 1; justify-content: center; min-height: 44px; } }
  .fields { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .fld { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--surface-2); }
  .fld input[type="number"] { width: 4.5em; border: 0; background: transparent; padding: 4px; font-family: var(--font-mono); text-align: right; }
  .fld input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--tiltak); }
  .detail { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .detail textarea, .detail input[type="text"] { border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; width: 100%; background: var(--surface-2); }
  .detail textarea { min-height: 48px; resize: vertical; }
  .tiltak-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  @media (max-width: 640px) { .tiltak-grid { grid-template-columns: 1fr; } }
  .frist { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .frist button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 9px; font-size: .78rem; min-height: 32px; }
  .frist button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .frist input[type="date"] { border: 1px solid var(--line-strong); border-radius: 8px; padding: 4px 6px; background: var(--surface-2); }
  .deeper { font-size: .8rem; color: var(--muted); }
  .deeper summary { font-weight: 500; }
  .deeper .qlist { margin-top: 8px; }
  .punkter { display: flex; flex-direction: column; gap: 10px; }
  .prow { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
  @media (max-width: 640px) { .prow { grid-template-columns: 1fr auto auto; } .prow label, .prow input { grid-column: 1 / -1; } }
  .prow label { font-size: .82rem; font-weight: 600; color: var(--muted); }
  .prow input { border: 1px solid var(--line-strong); border-radius: 9px; padding: 9px 11px; width: 100%; background: var(--surface); }
  .prow .prev { grid-column: 2; font-size: .8rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  @media (max-width: 640px) { .prow .prev { grid-column: 1; } }
  .mic { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; width: 40px; height: 40px; display: grid; place-items: center; }
  .mic.on { background: var(--tiltak-soft); border-color: var(--tiltak); }
  .run-foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line); padding: 10px clamp(16px, 3vw, 28px); }
  .run-foot .inner { max-width: 860px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .run-foot .hint { font-size: .78rem; color: var(--muted); }
  .run-foot .hint kbd { font-family: var(--font-mono); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; font-size: .7rem; }
  @media (max-width: 640px) { .run-foot .hint { display: none; } .run-foot .inner .btn.primary { flex: 1; } }
  body.kb .run-foot { display: none; }

  .area { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .area-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
  .area-head .roma { color: var(--accent); font-family: var(--font-display); font-size: 1rem; letter-spacing: 0; text-transform: none; margin-right: 6px; }
  .qlist { display: flex; flex-direction: column; gap: 8px; }
  .q { border: 1px solid var(--line); border-left-width: 4px; border-left-color: var(--ok); border-radius: 12px; background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .q.st-Risiko { border-left-color: var(--risk); }
  .q.st-Tiltak { border-left-color: var(--tiltak); }
  .q.cursor { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
  .q .qtext { display: flex; gap: 8px; align-items: baseline; }
  .q .qtext .n { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); min-width: 1.6em; }
  .q .qtext p { font-weight: 500; font-size: .92rem; }
  .q .help { font-size: .78rem; color: var(--muted); padding-left: calc(1.6em + 8px); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: .84rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; }
  .chip:hover { background: var(--surface-2); }
  .chip.OK[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok-ink); }
  .chip.Risiko[aria-pressed="true"] { background: var(--risk-soft); border-color: var(--risk); color: var(--risk-ink); }
  .chip.Tiltak[aria-pressed="true"] { background: var(--tiltak-soft); border-color: var(--tiltak); color: var(--tiltak-ink); }
  .chip.opt { font-weight: 500; }
  .chip.opt[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }

  .done { display: flex; flex-direction: column; gap: 16px; }
  .export .btn-row .btn { flex: 1 1 180px; }
  .teams { font-family: var(--font-mono); font-size: .82rem; white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow: auto; margin: 0; }
  .psum { display: flex; flex-direction: column; gap: 10px; }
  .psum .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: .9rem; color: var(--muted); }
  .stats b { color: var(--ink); font-family: var(--font-mono); }

  .overview { display: flex; flex-direction: column; gap: 16px; }
  .proj { display: grid; grid-template-columns: minmax(0, 1.4fr) 140px 200px; gap: 14px; align-items: center; }
  @media (max-width: 720px) { .proj { grid-template-columns: 1fr; } }
  .spark { width: 100%; height: 48px; }

  pids.forEach(pid => { const ss = store.sessions.filter(x => x.projectId === pid && x.date >= from).sort((a, b) => cmp(a.date, b.date)); if (!ss.length) return; const p = projectById(pid) || ss[ss.length - 1].project; L.push(""); L.push(`${p.prosjekt}${isIntern(p) ? " (intern rolle)" : isSalg(p) ? " (salgsarbeid)" : p.kunde ? " (" + p.kunde + ")" : ""}${p.vunnet ? ", vunnet " + fmtDate(p.vunnet) : ""}${p.avsluttet ? ", avsluttet " + fmtDate(p.avsluttet) : ""}: ${ss.length} runde${ss.length > 1 ? "r" : ""} · ${ss.map(x => `${MONTHS[Number(x.date.slice(5, 7)) - 1]} ${AMPEL_EMOJI[ampel(x)]}`).join(" ")}`); const risks = ss.map(x => x.punkter && x.punkter.risiko).filter(v => v && !NOTHING.test(v)); if (risks.length) L.push(`  Risiko meldt: ${risks.slice(-3).join(" · ")}`); if (p.slutt) { if (p.slutt.levert) L.push(`  Levert: ${p.slutt.levert}`); if (p.slutt.annerledes) L.push(`  Lærdom: ${p.slutt.annerledes}`); if (p.slutt.uavsluttet && !NOTHING.test(p.slutt.uavsluttet)) L.push(`  Uavsluttet: ${p.slutt.uavsluttet}`); } });
  const fag = []; store.sessions.filter(x => x.date >= from && x.deep).forEach(x => { const A = x.answers || {}; const pn = x.project.prosjekt; if (A.m2 && A.m2.comment) fag.push(`${pn}: miljø, ${A.m2.comment}`); ["l2", "l3"].forEach(k => { if (A[k] && A[k].status !== "OK" && A[k].comment) fag.push(`${pn}: ${A[k].comment}`); }); }); store.projects.filter(p => p.slutt && p.slutt.annerledes && p.avsluttet >= from).forEach(p => fag.push(`${p.prosjekt}: ${p.slutt.annerledes}`)); if (fag.length) { L.push(""); L.push("Til fag- og erfaringsrapporten:"); fag.forEach(x => L.push(`  ${x}`)); }
  const ps = store.sessions.filter(x => x.date >= from && x.pulse && x.pulse.belastning); if (ps.length) { const byM = {}; ps.forEach(x => { byM[x.date.slice(0, 7)] = x; }); L.push(""); L.push(`Puls per måned: ${Object.keys(byM).sort().map(m => `${MONTHS[Number(m.slice(5, 7)) - 1]} ${byM[m].pulse.belastning}/${byM[m].pulse.trivsel}${byM[m].person && byM[m].person.timer_uke ? " · " + byM[m].person.timer_uke + " t" : ""}`).join(" · ")} (belastning/trivsel)`); }
  const closed = store.tiltak.filter(t => t.status === "Lukket" && t.lukket && t.lukket >= from); const utv = store.tiltak.filter(t => t.area === "Utvikling" && t.dato >= from);
  L.push(""); L.push(`Tiltak lukket: ${closed.length}${closed.length ? ": " + closed.map(t => t.tekst).join(" · ") : ""}`);
  L.push(`Utvikling: ${utv.length ? utv.map(t => `${t.tekst} (${t.status.toLowerCase()})`).join(" · ") : "ingen registrert"}`);
  const deep = store.sessions.filter(x => x.date >= from && x.deep).length; L.push(`Full ROMA gjennomført: ${deep} ${deep === 1 ? "gang" : "ganger"}`); const mm = new Set(store.sessions.filter(x => x.date >= from && x.projectId === "").map(x => x.date.slice(0, 7))).size; if (mm) L.push(`Måneder mellom oppdrag: ${mm}`);
  return L.join("\n");
}
function renderOverview() {

    return `<div class="card proj"><div><b>${esc(p.prosjekt)}</b> ${p.avsluttet ? `<span class="pill closed">avsluttet ${fmtDate(p.avsluttet)}</span>` : ""}<br><span class="muted small">${isIntern(p) ? "intern rolle" : isSalg(p) ? "salgsarbeid" + (p.kunde ? " · " + esc(p.kunde) : "") : esc(p.kunde)}${p.andel ? ` · ${p.andel} %` : ""}</span><br><span class="small">${last ? `sist <b class="mono">${fmtDate(last.date)}</b>${p.avsluttet ? "" : ` · neste <b class="mono" style="${overdue ? "color:var(--tiltak-ink)" : ""}">${fmtDate(next)}</b>${overdue ? " · forfalt" : ""}`}<br><span class="lights-mini">${SIGNALS.map(S => `<i class="${SC[(last.sig[S.id] || {}).status || "OK"]}"></i>`).join("")}</span> ${esc(ampel(last))}` : "ingen runder ennå"}</span></div><div><div class="kpi ${open ? "tiltak" : "ok"}"><b>${open}</b><small>Åpne tiltak</small></div><div class="year" style="margin-top:8px" title="Siste 12 måneder">${yearDots(p.id, today)}</div></div><div>${p.avsluttet ? `<button type="button" class="btn ghost small" data-reopen="${esc(p.id)}">Gjenåpne</button>` : ""}</div></div>`; };
  el.innerHTML = `
    <div class="overview">
      <div class="area-head">
        <div><span class="eyebrow">Oversikt</span><h2>Deg og prosjektene dine</h2><p class="muted">${store.sessions.length} runder levert${personStreak(today) >= 2 ? ` · ${personStreak(today)} måneder på rad` : ""}</p></div>
        <div class="btn-row"><button type="button" class="btn" id="all-leder-btn" ${store.sessions.length ? "" : "disabled"}>Ledereksport, alle runder</button><button type="button" class="btn ghost" id="backup-btn">Sikkerhetskopi (JSON)</button><button type="button" class="btn ghost" id="import-btn">Hent sikkerhetskopi</button><input type="file" id="import-inp" accept="application/json" hidden><button type="button" class="btn ghost" id="year-btn" ${store.sessions.length ? "" : "disabled"}>Årsutskrift</button></div>
      </div>
      ${all.some(s => s.pulse && s.pulse.belastning) ? `<div class="card proj"><div><b>Puls</b><br><span class="muted small">${new Set(all.filter(s => s.pulse && s.pulse.belastning).map(s => s.date.slice(0, 7))).size} måneder${mellomStreak(today) ? ` · ${mellomStreak(today)}. måned mellom oppdrag` : ""}</span></div><div></div><div>${sparkSvg(Object.values(all.filter(s => s.pulse && s.pulse.belastning).reduce((m, s) => { m[s.date.slice(0, 7)] = s; return m; }, {})).sort((a, b) => cmp(a.date, b.date)))}<div class="legend"><span><i style="background:var(--tiltak)"></i>Belastning</span><span><i style="background:var(--accent)"></i>Trivsel</span></div></div></div>` : ""}

        ${store.tiltak.length ? `<div class="table-wrap"><table><thead><tr><th></th><th>Opprettet</th><th>Prosjekt</th><th>Tiltak</th><th>Ansvarlig</th><th>Frist</th><th>Status</th></tr></thead><tbody>${store.tiltak.slice().sort((a, b) => (a.status === b.status ? cmp(a.frist || "9", b.frist || "9") : a.status === "Åpen" ? -1 : 1)).map(t => `<tr><td><input type="checkbox" data-tiltak="${esc(t.id)}" ${t.status === "Lukket" ? "checked" : ""} aria-label="Lukk tiltak"></td><td class="mono">${fmtDate(t.dato)}</td><td>${esc(t.prosjekt)}${t.timer ? `<br><span class="muted small">ca. ${t.timer} t</span>` : ""}</td><td>${esc(t.tekst)}<br><span class="muted small">${esc(t.area)}${t.kommentar ? " · " + esc(t.kommentar) : ""}</span></td><td>${esc(t.ansvarlig)}</td><td class="mono" style="${t.status === "Åpen" && t.frist && t.frist < today ? "color:var(--tiltak-ink)" : ""}">${fmtDate(t.frist)}</td><td><span class="pill ${t.status === "Åpen" ? "open" : "closed"}">${esc(t.status)}</span></td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">Ingen tiltak logget ennå.</p>`}
      </div>
      ${store.sessions.length ? `<div class="card"><div class="area-head" style="margin-bottom:8px"><h3>Leverte runder</h3></div><div class="table-wrap"><table><thead><tr><th>Dato</th><th>Prosjekt</th><th>Signaler</th><th></th></tr></thead><tbody>${all.slice().reverse().map(s => `<tr><td class="mono">${fmtDate(s.date)}</td><td>${esc(s.project.prosjekt)}</td><td>${s.projectId ? `<span class="lights-mini">${SIGNALS.map(S => `<i class="${SC[(s.sig[S.id] || {}).status || "OK"]}"></i>`).join("")}</span>` : `<span class="muted small">${esc(ampel(s))}</span>`}${s.deep ? ' <span class="muted small">+ full ROMA</span>' : ""}</td><td><button type="button" class="btn small" data-open="${esc(s.id)}">Åpne</button></td></tr>`).join("")}</tbody></table></div></div>` : ""}
      <details class="card" id="yearbox" hidden><summary>Årsutskrift til medarbeidersamtalen</summary><pre class="teams" id="year-pre" style="margin-top:10px"></pre><div class="btn-row" style="margin-top:8px"><button type="button" class="btn small" id="year-copy">Kopier</button></div></details>
      <div class="card"><div class="area-head"><div><h3>Dine data</h3><p class="muted small">Alt ligger kun i denne nettleseren. Bytter du maskin, ta sikkerhetskopi først. Deler du maskin, slett når du er ferdig. Safari kan slette lokale data etter 7 dager uten besøk, så ta sikkerhetskopi jevnlig.</p></div><button type="button" class="btn ghost danger" id="wipe-btn">Slett alle mine data</button></div></div>
      <p class="note privacy muted small">${esc(PRIVACY_TEXT)}</p>
    </div>`;
  $("#all-leder-btn", el).addEventListener("click", () => exportLeader(store.sessions));
  $("#year-btn", el).addEventListener("click", () => { const box = $("#yearbox", el); box.hidden = false; box.open = true; $("#year-pre", el).textContent = yearReport(); box.scrollIntoView({ block: "start" }); });
  $("#year-copy", el).addEventListener("click", async () => { try { await navigator.clipboard.writeText(yearReport()); toast("Kopiert"); } catch (e) { toast("Kunne ikke kopiere"); } });
  $("#backup-btn", el).addEventListener("click", ev => { const b = ev.currentTarget; if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Filen inneholder alt, også puls og Trygghet. Lagre privat, aldri i prosjektmappen. Last ned"; return; } saveFile(`${isoToday().replace(/-/g, "")}_ViaROMA_sikkerhetskopi.json`, JSON.stringify(store, null, 2)); });
  $$("[data-reopen]", el).forEach(b => b.addEventListener("click", () => { const p = projectById(b.dataset.reopen); if (!p) return; p.avsluttet = ""; saveStore(); toast(`${p.prosjekt} er aktivt igjen. Sluttevalueringen er beholdt.`); renderOverview(); }));
  $("#import-btn", el).addEventListener("click", () => $("#import-inp", el).click());
  $("#wipe-btn", el).addEventListener("click", ev => { const b = ev.currentTarget; if (b.dataset.armed) { wipeAll(); toast("Alt er slettet fra denne nettleseren"); renderHome(); } else { b.dataset.armed = "1"; b.textContent = "Sikker? Slett alt nå"; } });
  $("#import-inp", el).addEventListener("change", ev => {
    const f = ev.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try {
      const data = JSON.parse(r.result); if (!data || typeof data !== "object") throw new Error("format"); let n = 0;
      (Array.isArray(data.projects) ? data.projects : []).forEach(p => { const o = normProject(p); if (o && !store.projects.some(x => x.id === o.id)) store.projects.push(o); });
      const have = new Set(store.sessions.map(s => s.id));
      (Array.isArray(data.sessions) ? data.sessions : []).forEach(s => { const v = normSession(s); if (v && !have.has(v.id) && (!v.projectId || projectById(v.projectId) || v.project.prosjekt)) { if (v.projectId && !projectById(v.projectId)) { const np = normProject(Object.assign({ id: v.projectId }, v.project)); if (np) store.projects.push(np); } store.sessions.push(v); n++; } });
